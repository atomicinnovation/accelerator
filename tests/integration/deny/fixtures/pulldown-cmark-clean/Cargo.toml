# Positive control: the sanctioned wrapper `document` IS the dependent, so the
# wrapper ban permits pulldown-cmark and `check bans` exits zero — a passing run
# means "evaluated and allowed", not "evaluated nothing". Isolated with its own
# empty [workspace] like the banned fixture.
[workspace]

[package]
name = "document"
version = "0.0.0"
edition = "2021"
license = "MIT"

[dependencies]
pulldown-cmark = { path = "crates/pulldown-cmark", version = "0.13.4" }

[[bin]]
name = "document"
path = "src/main.rs"
