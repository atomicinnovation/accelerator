name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  test-unit:
    name: Run unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # test:unit:cli compiles Rust on BOTH matrix legs (previously only the
      # ubuntu server-check compiled Rust), so the toolchain-cache race applies
      # here too: route rustup into the cached mise data dir before install.
      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          # OS-disambiguated so the ubuntu/macos legs never share a
          # toolchain-cache namespace.
          cache_key_prefix: mise-test-unit-${{ matrix.os }}-v1
          experimental: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # Both Cargo workspaces live OFF the repo root, so rust-cache's
          # default (./target) caches no build artifacts — the workspace root(s)
          # each job compiles must be named explicitly. test:unit:cli builds the
          # cli workspace.
          workspaces: cli

      - name: Run unit tests
        run: mise run test:unit

  test-integration:
    name: Run integration tests
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # test:integration:deny (and the visualiser cargo tests) run cargo on
      # BOTH matrix legs, so route rustup into the cached mise data dir before
      # install to avoid the toolchain-cache race.
      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          cache_key_prefix: mise-test-integration-${{ matrix.os }}-v1
          experimental: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # test:integration:visualiser compiles the server, now a cli/
          # workspace member; test:integration:deny only reads cli metadata (no
          # build), and its crate downloads are covered by the always-cached
          # cargo registry.
          workspaces: cli

      - name: Run integration tests
        run: mise run test:integration

  test-e2e:
    name: Run E2E tests
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      # test:e2e builds the dev server (build:server:dev) on the host before the
      # Playwright run, so cache the cli/ workspace target/ across runs.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli

      - name: Run E2E tests
        run: mise run test:e2e

  test-visual-regression:
    name: Run visual regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      # The build:server:dev dependency compiles the server on the host (only
      # the Playwright compare step runs in Docker), so cache its target/.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli

      - name: Run visual regression tests
        run: mise run test:e2e:visualiser:docker

  check-scripts:
    name: Check scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Run script checks
        run: mise run scripts:check

  check-build-system:
    name: Check build system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Run build system checks
        run: mise run build-system:check

  check-visualiser-server:
    name: Check visualiser server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Route the rustup toolchain inside the mise data dir, which mise-action
      # caches in full, so the rustfmt/clippy components persist across runs.
      # By default, rust lives in ~/.rustup (outside the cache), so a cache hit
      # makes `mise install` no-op while the toolchain is absent and the
      # parallel format/lint server checks race to auto-install it ("detected
      # conflict: bin/cargo"). Must be set before mise install runs.
      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          # Own cache namespace: this job's cache carries the rust toolchain the
          # other jobs don't need, and a distinct key forces the first run after
          # this change to repopulate it under the relocated RUSTUP_HOME.
          cache_key_prefix: mise-server-v1
          experimental: true

      # server:check runs clippy over two feature passes (two cold compiles),
      # so cache the server workspace's target/. Complementary to the
      # RUSTUP_HOME routing above: that isolates the toolchain, this caches
      # build artifacts.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli

      - name: Run visualiser server checks
        run: mise run server:check

  check-cli:
    name: Check cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # Route the rustup toolchain inside the mise data dir (which mise-action
      # caches in full) so the rustfmt/clippy components persist across runs.
      # By default rust lives in ~/.rustup (outside the cache), so a cache hit
      # makes `mise install` no-op while the toolchain is absent and parallel
      # cargo passes race to auto-install it. Must be set before mise install.
      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          # Own toolchain-cache namespace, distinct from every other cargo job
          # so jobs never share a toolchain-cache namespace.
          cache_key_prefix: mise-cli-v1
          experimental: true

      # Complementary to the RUSTUP_HOME routing above: that isolates the
      # toolchain, this caches the cli workspace's target/.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli

      - name: Run cli checks
        run: mise run cli:check

  check-supply-chain:
    name: Check supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # cargo-deny shells `cargo metadata`, so the toolchain-cache race applies
      # here too: route rustup into the cached mise data dir before install.
      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          cache_key_prefix: mise-supply-chain-v1
          experimental: true

      # The RustSec advisory DB is fetched fresh each run (never cached stale)
      # so newly-disclosed advisories are caught; cargo-deny fails, not warns,
      # if the DB is unavailable.
      - name: Run supply-chain checks
        run: mise run deny:check

  check-architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          cache_key_prefix: mise-architecture-v1
          experimental: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # pup:check, test:integration:pup and public-api:check all build the
          # cli workspace (under the nightly toolchain).
          workspaces: cli

      # This is the only nightly-consuming job. Every step below reaches the
      # pinned nightly through deps:install:nightly, pulled in behind its
      # tool's install task, so the toolchain is provisioned once and no two
      # steps race on ~/.rustup. Both tools are rebuilt from source each run —
      # neither has a trustworthy per-OS prebuilt checksum.
      #
      # The first step sets no ACCELERATOR_PUP_MODE, so CI runs the fail-closed
      # `deny` default — `warn` can never be the CI default.
      - name: Run architecture check (self-provisions the nightly lane)
        run: mise run pup:check

      - name: Run cargo-pup behavioural regression
        run: mise run test:integration:pup

      # Shares this job rather than getting its own: it needs the same nightly
      # for rustdoc's JSON output, and a job of its own would only provision
      # that toolchain a second time.
      - name: Pin each named crate's public API
        run: mise run public-api:check

  check-zero-spawn:
    name: Check zero-spawn
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Its own job rather than a leg of test-unit/test-integration: those are OS
    # matrices, and shadowing system binaries fails under SIP on macOS.
    #
    # Containment assumes EPHEMERAL runners. Moving to self-hosted,
    # containerised or reusable ones turns a contained hazard into a
    # persistently broken runner.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Route the rust toolchain into the cached mise data dir
        run: echo "RUSTUP_HOME=$HOME/.local/share/mise/rustup" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          # cache: false on purpose. The jj shadow target sits inside the tree
          # mise-action saves on its post step, which runs AFTER the restore, so
          # a failed restore would persist a jj-less tool tree into the cache
          # that every later run restores — self-perpetuating until someone
          # bumped the prefix. This job installs one toolchain plus jj, so
          # disabling its cache is cheap and removes the hazard outright.
          cache: false
          experimental: true

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: cli

      # One task owns the ordering that makes this meaningful. mise is entered
      # before the shadow window and never inside it, or it could see `jj`
      # missing mid-run and reinstall it, making the assertion vacuous.
      - name: Run the strong-form zero-spawn suite
        timeout-minutes: 10
        env:
          # The task refuses to shadow anything without this.
          ACCELERATOR_ZERO_SPAWN_SHADOW: "yes"
        run: mise run test:integration:zero-spawn:strong

      # Backstop for the case where the task died before its `finally` ran.
      # Deliberately NOT `mise run`: that would reinstall the missing tool,
      # turning the one check that catches a failed restore into one that
      # quietly repairs it.
      - name: Assert the restore worked
        if: always()
        run: |
          git --version
          jj --version

  check-visualiser-frontend:
    name: Check visualiser frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Run visualiser frontend checks
        run: mise run frontend:check

  check-measure-harness:
    name: Check measurement harness
    runs-on: ${{ matrix.os }}
    # Non-blocking, and absent from the prerelease `needs` list on purpose: the
    # harness dispatches through the real bootstrap, so it needs network egress
    # and a published signed release for the tree's own version — and the tree
    # is routinely ahead of the last cut. The task reports that as an unmet
    # prerequisite rather than a failure; continue-on-error covers the rest.
    #
    # It exists because test:integration:measure is excluded from the
    # test:integration roll-up, and an exclusion with no owner just restores the
    # unowned state the module would rot in. It also records `sha256sum`'s
    # resolution on both lanes, so the fast-backend population is a known number
    # rather than an assumption.
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # The recovery contract reads two deleted files at a pinned commit.
          # A GitHub checkout has no .jj, so the harness uses the git form —
          # which needs unshallowed history.
          fetch-depth: 0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          cache_key_prefix: mise-measure-v1
          experimental: true

      - name: Record the digest-backend population
        run: command -v sha256sum || echo "sha256sum absent on this runner"

      - name: Run the measurement harness smoke check
        run: mise run test:integration:measure -- --engine=git

  check-docs:
    name: Check documentation site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          # No step needs git credentials after checkout; keep the token
          # off disk while npm lifecycle scripts run.
          persist-credentials: false

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Run documentation site checks
        run: mise run docs:check

  # Assemble the vendored runtime upstream of any signing job, in a job holding
  # no credentials — it extracts three third-party archives, so it must not be
  # able to reach the release secret, mint an OIDC token, or write attestations.
  # It needs no GitHub token: the SLSA provenance is verified with `cosign`
  # against the public Sigstore log, not GitHub's attestation API; nothing here
  # can reference ACCELERATOR_RELEASE_SECRET_KEY.
  assemble-runtime:
    name: Assemble vendored runtime
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions: {}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      # Fail fast and legibly if the trust anchors are still placeholders, before
      # the upstream verification hits a missing publisher key or the pin gate
      # rejects a real digest against a placeholder.
      - name: Check trust anchors
        run: mise run vendor:check-trust-anchors

      - name: Verify upstream inputs
        run: mise run vendor:verify-upstream-inputs

      - name: Assemble tree artifacts
        run: mise run vendor:assemble-tree-artifacts

      # Per-target upload so each smoke leg downloads only its own ~300MB, not
      # the whole ~1.2GB set. The .sealed attestation ships alongside; the
      # .sealed.sig does not exist yet (only the publishing job holds the key).
      - name: Upload darwin-arm64 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accelerator-runtime-darwin-arm64
          path: dist/release/accelerator-*-darwin-arm64.tar.gz*
          if-no-files-found: error
      - name: Upload darwin-x64 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accelerator-runtime-darwin-x64
          path: dist/release/accelerator-*-darwin-x64.tar.gz*
          if-no-files-found: error
      - name: Upload linux-x64 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accelerator-runtime-linux-x64
          path: dist/release/accelerator-*-linux-x64.tar.gz*
          if-no-files-found: error
      - name: Upload linux-arm64 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accelerator-runtime-linux-arm64
          path: dist/release/accelerator-*-linux-arm64.tar.gz*
          if-no-files-found: error

  # Execute the vendored Node and headless shell natively per target — a
  # stronger gate than extraction, catching a structurally-wrong assembly that
  # is nonetheless correctly signed and hashed. Native on each target: an arm64
  # binary mis-assembled into the darwin-x64 archive runs under Rosetta on the
  # arm64 runner but a native Intel host refuses it, so the check is independent
  # of the structural architecture read. Holds no credentials.
  # NOTE: ubuntu-24.04-arm is free only for public repos — confirm the entitlement.
  smoke-runtime:
    name: Smoke vendored runtime
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    needs: assemble-runtime
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: darwin-x64, os: macos-15-intel }
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Download runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: accelerator-runtime-${{ matrix.platform }}
          path: dist/release

      - name: Smoke the runtime
        env:
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: mise run vendor:smoke-runtime

  prerelease:
    name: Create prerelease
    runs-on: macos-latest
    needs:
      - check-docs
      - test-unit
      - test-integration
      - test-e2e
      - test-visual-regression
      - check-scripts
      - check-build-system
      - check-visualiser-server
      - check-visualiser-frontend
      - check-cli
      - check-supply-chain
      - check-architecture
      - check-zero-spawn
      - assemble-runtime
      - smoke-runtime
    if: github.event_name == 'push'
    # Serialise all release pipelines onto one queue: prepare (pull + bump) and
    # finalise (commit + tag + push) are steps in this single job, so a queued
    # pipeline cannot start its prepare until the running one has pushed — which
    # stops two pipelines bumping to the same version and racing their pushes.
    # cancel-in-progress: false makes runs wait rather than abort; queue: max
    # then FIFO-queues pending runs (up to 100) instead of evicting the single
    # pending slot, so an approved release queued behind a running prerelease is
    # never dropped. (queue: max with cancel-in-progress: true is a validation
    # error — keep it false.)
    # Keep in sync with the other accelerator-release block: both members must
    # declare identical settings (group, cancel-in-progress: false, queue: max).
    concurrency:
      group: accelerator-release
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        name: Get releaser token
        id: app-token
        with:
          client-id: ${{ vars.ACCELERATOR_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.ACCELERATOR_RELEASER_SECRET }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      # prerelease:prepare cross-compiles server + cli for all four targets, so
      # cache both workspaces' target/ (each triple's artifacts live under the
      # workspace's own target/). The signing secret is scoped to the Sign step
      # below, never present during this cached compile.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: |
            cli

      # The tree archives arrive as opaque workflow artifacts, into dist/release
      # (gitignored, so invisible to the version-bump commit's leaked-artifact
      # guard). prerelease:prepare then gates each against pins.ASSEMBLED_SHA256
      # from this job's own clean checkout.
      # NOTE: the actions/download-artifact ref must be SHA-pinned before merge.
      - name: Download assembled runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: accelerator-runtime-*
          merge-multiple: true
          path: dist/release

      - name: Prepare prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run prerelease:prepare

      # Only this step carries the signing secret — the Prepare step above runs
      # cargo zigbuild over untrusted transitive build scripts, so the secret is
      # never in the environment during compilation.
      - name: Sign prerelease
        env:
          ACCELERATOR_RELEASE_SECRET_KEY: ${{ secrets.ACCELERATOR_RELEASE_SECRET_KEY }}
        run: mise run prerelease:sign

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            skills/visualisation/visualise/bin/accelerator-visualiser-*
            dist/release/accelerator-*
            dist/release/manifest.json
            dist/release/manifest.minisig

      - name: Finalise prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run prerelease:finalise

  approve-release:
    name: Approve release
    # Cheapest host for a no-op gate: this job runs one trivial step and needs
    # no toolchain (macOS is only required for the cross-compile/attest steps on
    # the prerelease/release work jobs).
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: prerelease
    # The approval gate lives HERE and carries NO concurrency group — on
    # purpose. GitHub Actions acquires a concurrency group at queue time, so a
    # job in the "Waiting" approval state holds its group for the entire,
    # unbounded approval wait. Giving this gate ANY group would recreate the
    # original bug inside the approval lane: a Waiting approval would hold the
    # group and stop every later push's approval gate from even reaching its own
    # prompt — you could only ever act on the oldest pending approval, never
    # pick which pipeline to release.
    #
    # So each push spawns an independent, simultaneously-visible gate and any
    # can be approved in any order. Approving several does NOT race two
    # simultaneous releases: the `release` work job's accelerator-release lock
    # (queue: max) serialises the publish window, and release:prepare re-pulls +
    # re-bumps against current HEAD at execution time, so each approved release
    # cuts a sequential, HEAD-correct stable version. That is the intended "each
    # approved push gets its release" semantics, not a hazard.
    environment: release
    steps:
      # No-op: this job exists solely to host the environment approval gate.
      - name: Approval gate (no-op; the gate is the environment, not this step)
        run: echo "Stable release approved"

  release:
    name: Create release
    runs-on: macos-latest
    if: github.event_name == 'push'
    needs:
      - approve-release
      - assemble-runtime
      - smoke-runtime
    # The release lock lives HERE, deliberately WITHOUT `environment`. This
    # group must never enclose the approval gate (see approve-release) — a
    # Waiting, approval-gated job holds its concurrency group for its whole
    # wait, which would block every subsequent prerelease. By the time this job
    # is queued the release is already approved, so the lock covers only the
    # active commit/tag/push window (tasks/release.py:_publish), exactly as
    # intended.
    # Keep in sync with the other accelerator-release block: both members must
    # declare identical settings (group, cancel-in-progress: false, queue: max).
    concurrency:
      group: accelerator-release
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        name: Get releaser token
        id: app-token
        with:
          client-id: ${{ vars.ACCELERATOR_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.ACCELERATOR_RELEASER_SECRET }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      # release:prepare (and the post-stable prerelease:prepare below)
      # cross-compile server + cli for all four targets, so cache both
      # workspaces' target/. The signing secret is scoped to the Sign steps,
      # never present during this cached compile.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: |
            cli

      # The assembled tree archives arrive as opaque workflow artifacts, checked
      # against pins.ASSEMBLED_SHA256 from this job's own clean checkout inside
      # release:prepare and re-signed here — the release job holds the key, the
      # upstream job never did.
      # NOTE: the actions/download-artifact ref must be SHA-pinned before merge.
      - name: Download assembled runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: accelerator-runtime-*
          merge-multiple: true
          path: dist/release

      # The steps below stay INSIDE this locked, approved job on purpose: the
      # post-stable prerelease re-cut (prepare/attest/finalise, last three
      # steps) must run after the stable push and within the same
      # accelerator-release window so no concurrent pipeline can bump/push
      # between the two cuts (version monotonicity). Do not hoist it into a
      # separate job.
      - name: Prepare stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:prepare

      - name: Sign stable release
        env:
          ACCELERATOR_RELEASE_SECRET_KEY: ${{ secrets.ACCELERATOR_RELEASE_SECRET_KEY }}
        run: mise run release:sign

      - name: Attest stable binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            skills/visualisation/visualise/bin/accelerator-visualiser-*
            dist/release/accelerator-*
            dist/release/manifest.json
            dist/release/manifest.minisig

      - name: Finalise stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run release:finalise

      - name: Prepare post-stable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run prerelease:prepare

      - name: Sign post-stable prerelease
        env:
          ACCELERATOR_RELEASE_SECRET_KEY: ${{ secrets.ACCELERATOR_RELEASE_SECRET_KEY }}
        run: mise run prerelease:sign

      - name: Attest post-stable binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            skills/visualisation/visualise/bin/accelerator-visualiser-*
            dist/release/accelerator-*
            dist/release/manifest.json
            dist/release/manifest.minisig

      - name: Finalise post-stable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run prerelease:finalise

  # Build (npm lifecycle scripts included) runs unprivileged; only the
  # deploy job below holds the Pages/OIDC permissions, so no dependency
  # code ever executes with those tokens in scope. Needing `release` means
  # docs are rebuilt and published only when a stable release ships; if the
  # release is not approved, both jobs skip.
  build-docs:
    name: Build documentation site
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          # No step needs git credentials after checkout; keep the token
          # off disk while npm lifecycle scripts run.
          persist-credentials: false

      - name: Install dependencies
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          install: true
          cache: true
          experimental: true

      - name: Build documentation site
        run: mise run docs:build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy-docs:
    name: Deploy documentation site
    runs-on: ubuntu-latest
    needs: build-docs
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
