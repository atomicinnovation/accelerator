<style>

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail-w: 248px;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --panel: #151a22; --panel-2: #1b212b; --ink: #e4e8ef; --ink-2: #a8b2c2; --ink-3: #7d889b;
    --rule: #283041; --accent: #8ba5ff; --accent-ink: #0d1015; --accent-soft: #1d2747;
    --add-bg: #0f2a19; --add-mark: #4cc27a; --del-bg: #351719; --del-mark: #ff7f76; --hl-row: #3a3215;

  --rule: #283041; --accent: #8ba5ff; --accent-ink: #0d1015; --accent-soft: #1d2747;
  --add-bg: #0f2a19; --add-mark: #4cc27a; --del-bg: #351719; --del-mark: #ff7f76; --hl-row: #3a3215;
  --ok: #4cc27a; --warn: #e2b23f; --bad: #ff7f76; --info: #8ba5ff; --none: #8a94a6;

}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); text-underline-offset: 2px; }
code, kbd, .mono { font-family: var(--f-mono); font-size: .86em; }
:not(pre) > code { background: var(--panel-2); border-radius: 4px; padding: .05em .32em; overflow-wrap: anywhere; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
h1 { font-size: 1.85rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
.prose { max-width: 72ch; display: grid; gap: .7em; align-content: start; }
.prose ul, .prose ol { margin: 0; padding-left: 1.25em; display: grid; gap: .3em; }
.prose pre, .md pre { background: var(--panel-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; font-size: 13px; line-height: 1.45; }
.prose pre code, .md pre code { background: none; padding: 0; font-size: inherit; }
.md { display: grid; gap: .55em; min-width: 0; align-content: start; }
.md > * { margin: 0; }
.md > :is(p, ul, ol, blockquote, h1, h2, h3, h4) { max-width: 72ch; }
.md ul, .md ol { padding-left: 1.2em; display: grid; gap: .25em; }
.eyebrow { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-inner { min-height: var(--top-h); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 8px; }
.pr-id { font-family: var(--f-mono); font-weight: 600; font-size: 13px; background: var(--ink); color: var(--panel); border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
.pr-title { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; min-width: 0; flex: 1 1 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.meter { display: grid; gap: 3px; min-width: 92px; }
.meter-label { font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.meter-bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.meter-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.decision-chip { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--rule); white-space: nowrap; }

/* Shell */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.rail { border-right: 1px solid var(--rule); padding: 18px 10px 40px max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); align-self: start; max-height: calc(100vh - var(--top-h)); overflow-y: auto; }
.rail-group { display: grid; gap: 1px; margin-bottom: 14px; }
.rail-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 6px; }
.rail a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 6px; font-size: 14px; min-width: 0; }
.rail a:hover { background: var(--panel-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail a .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail a .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.rail a.sub { padding-left: 22px; font-size: 13.5px; }
.rail-path { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); padding: 0 10px 10px; overflow-wrap: anywhere; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.view > *, .section > *, .stack > *, .grid-2 > *, .grid-3 > * { min-width: 0; }
.view-head { display: grid; gap: 8px; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 70ch; }

/* Generic blocks */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.section > h2, .section > .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
.loc { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.loc:hover { text-decoration: underline; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.c-major, .c-high, .c-bad, .c-block, .c-blocking, .c-issue, .c-disputed, .c-fail { color: var(--bad); }
.c-major { color: var(--sev-major); }
.c-minor, .c-medium, .c-warn, .c-fix-now, .c-concerns, .c-question, .c-partly, .c-cancelled { color: var(--warn); }
.c-minor { color: var(--sev-minor); }
.c-suggestion, .c-low, .c-none, .c-reject, .c-drop, .c-skip, .c-unverified, .c-skipped { color: var(--sev-sugg); }
.c-ok, .c-confirmed, .c-understood, .c-approve, .c-pass, .c-yes { color: var(--ok); }
.c-info, .c-follow-up { color: var(--info); }
.lens { font-size: 11.5px; color: var(--ink-3); font-family: var(--f-mono); }

/* Review controls */
.ctl { display: grid; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.seg button:hover { border-color: var(--ink-3); color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--panel); border-color: transparent; font-weight: 600; }
.seg button[aria-pressed="true"].t-ok { background: var(--ok); }
.seg button[aria-pressed="true"].t-warn { background: var(--warn); }
.seg button[aria-pressed="true"].t-bad { background: var(--bad); }
.seg button[aria-pressed="true"].t-info { background: var(--info); }
.seg button[aria-pressed="true"].t-none { background: var(--none); }
.seg .note-toggle { border-style: dashed; }
.ctl textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); }
.ctl .saved { font-size: 11.5px; color: var(--ink-3); }
.ro .seg button, .ro textarea { pointer-events: none; opacity: .75; }
.ctl.via .seg button.t-ok[aria-pressed="false"] { border-style: dashed; border-color: var(--ok); color: var(--ok); }
.via-note { font-size: 11.5px; color: var(--ink-3); }
.since-note { font-size: 11.5px; color: var(--warn); }

/* Banners */
.banner { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); }
.banner strong { color: var(--ink); }

/* Code */
.code { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); overflow: auto; max-height: 560px; min-width: 0; }
.code.tall { max-height: none; overflow-x: auto; }
.code-head { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--rule); background: var(--panel-2); font-family: var(--f-mono); font-size: 12px; position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
.code-head .path { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.code-head a { margin-left: auto; font-family: var(--f-body); font-size: 12px; }
.code table { border-collapse: collapse; width: 100%; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; }
.code td { padding: 0 8px; vertical-align: top; }
.code td.ln { width: 1%; min-width: 38px; white-space: nowrap; text-align: right; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums; padding: 0 6px; }
.code td.mk { width: 1%; padding: 0 4px; user-select: none; color: var(--ink-3); }
.code td.src { white-space: pre; padding-right: 16px; }
.code tr.add { background: var(--add-bg); }
.code tr.add td.mk { color: var(--add-mark); font-weight: 600; }
.code tr.del { background: var(--del-bg); }
.code tr.del td.mk { color: var(--del-mark); font-weight: 600; }
.code tr.focus td.ln { color: var(--ink); font-weight: 600; }
.code tr.flash { background: var(--hl-row) !important; }
.code tr.unread td.ln:first-child { box-shadow: inset 4px 0 0 var(--warn); }
.code tr.read td.ln:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.code tr.read td.ln:first-child::before { content: "✓"; float: left; padding-left: 6px; color: var(--ok); font-weight: 700; }
.code tr.add.read { background: color-mix(in srgb, var(--add-bg) 40%, var(--panel)); }
.code tr.del.read { background: color-mix(in srgb, var(--del-bg) 40%, var(--panel)); }
.code tr.read td.src, .code tr.read td.mk { opacity: .6; }
.read-key { display: inline-flex; gap: 12px; align-items: center; color: var(--ink-3); }
.read-key i { display: inline-block; width: 4px; height: 12px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
.read-key .k-unread { background: var(--warn); }
.read-key .k-read { background: var(--ok); }
.read-key .k-superseded { background: var(--none); }
.code tr[data-lk] td.ln { cursor: pointer; }
.code tr[data-lk] td.ln:hover { color: var(--ink); text-decoration: underline; }
.code tr.superseded.unread td.ln:first-child { box-shadow: inset 4px 0 0 var(--none); }
.code tr.superseded td.src { font-style: italic; }
.code tr.blk td { padding: 2px 10px 2px 14px; background: var(--panel); font-family: var(--f-body); font-size: 11.5px; line-height: 1.6; }
.code tr.blk button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.commit-msg { white-space: pre-wrap; font-size: 14px; color: var(--ink-2); max-width: 80ch; overflow-wrap: anywhere; }
.fl-item.cm-item .nm { direction: ltr; font-family: var(--f-body); }
.commit-files { display: grid; gap: 14px; }
.pager-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pager-row .btn[disabled] { opacity: .45; cursor: default; }
kbd { border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11.5px; }
.code tr.gap td { background: var(--panel-2); color: var(--ink-3); font-family: var(--f-body); font-size: 12px; padding: 3px 10px; }
.code tr.gap button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
.code tr.anno td { padding: 8px 12px 10px 60px; background: var(--panel); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); white-space: normal; font-family: var(--f-body); font-size: 13.5px; }
.anno-list { display: grid; gap: 8px; max-width: 90ch; }
.anno-item { display: grid; gap: 4px; border-left: 3px solid var(--accent); padding-left: 10px; }
.anno-item.k-ledger { border-color: var(--bad); }
.anno-item.k-finding { border-color: var(--warn); }
.gut { display: inline-block; font-size: 10px; font-weight: 700; font-family: var(--f-body); border-radius: 3px; padding: 0 4px; margin-left: 4px; color: var(--panel); background: var(--accent); vertical-align: 1px; }
.gut.k-ledger { background: var(--bad); }
.gut.k-finding { background: var(--warn); }
.hljs-keyword, .hljs-selector-tag, .hljs-section { color: var(--tok-kw); }
.hljs-title, .hljs-type, .hljs-title.class_, .hljs-title.function_ { color: var(--tok-title); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-char { color: var(--tok-str); }
.hljs-comment, .hljs-quote, .hljs-doctag { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--tok-num); }
.hljs-meta, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: var(--tok-meta); }
.hljs-built_in, .hljs-selector-class, .hljs-name { color: var(--tok-built); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }

/* Tour */
.chapter-list { display: grid; gap: 10px; counter-reset: ch; }
.chapter-card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: start; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.chapter-card:hover { border-color: var(--accent); }
.ch-num { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.chapter-card .meta { display: grid; gap: 4px; justify-items: end; text-align: right; }
.stop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; padding-block: 18px; border-top: 1px solid var(--rule); }
.stop-note { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 12px); min-width: 0; }
.fit { display: grid; gap: 4px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; }
.stop-figure, .stop-head { grid-column: 1 / -1; }
.stop-num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.check { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; font-size: 14px; }
.check .eyebrow { color: var(--warn); }
.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--panel); }
.ba > div { padding: 12px 14px; border-bottom: 1px solid var(--rule); min-width: 0; }
.ba > div:nth-child(odd) { border-right: 1px solid var(--rule); }
.ba .ba-aspect { grid-column: 1 / -1; background: var(--panel-2); font-weight: 600; font-size: 13.5px; padding: 7px 14px; }
.ba .eyebrow { margin-bottom: 4px; }

<script>

/* ---------- Review state ---------- */
const KINDS = {

  design: { label: 'Design decision', opts: [['agree', 'Agree', 'ok'], ['question', 'Question', 'warn'], ['disagree', 'Disagree', 'bad']] },
  chapter: { label: 'Sign-off', opts: [['understood', 'Signed off', 'ok'], ['concerns', 'Concerns', 'warn'], ['blocking', 'Blocking', 'bad']] },
  stop: { label: 'Stop', opts: [['ok', 'Read', 'ok'], ['question', 'Question', 'warn'], ['issue', 'Issue', 'bad']] },
  invariant: { label: 'Invariant', opts: [['ok', 'Holds', 'ok'], ['question', 'Unsure', 'warn'], ['issue', 'Broken', 'bad']] },
  ledger: { label: 'Removal site', opts: [['ok', 'Safe', 'ok'], ['question', 'Unsure', 'warn'], ['issue', 'Unsafe', 'bad']] },
  finding: { label: 'Triage', opts: [['block', 'Block merge', 'bad'], ['fix-now', 'Fix in PR', 'warn'], ['follow-up', 'Follow-up', 'info'], ['reject', 'Reject', 'none']] },
  file: { label: 'File', opts: [['ok', 'Reviewed', 'ok'], ['skip', 'Skimmed', 'none'], ['issue', 'Issue', 'bad']] },
  commit: { label: 'Commit', opts: [['ok', 'Reviewed', 'ok'], ['skip', 'Skimmed', 'none'], ['issue', 'Issue', 'bad']] },

const Store = {
  mode: 'none', canWrite: true, version: 0, docs: new Map(), db: null, pending: new Map(), inflight: new Set(), reachable: true,
  key: 'explore-pr',

  async init() {

    renderBanner();
    onStateChange();
  },
  put(target, kind, patch, meta) {
    if (!this.canWrite) return;
    const cur = this.get(target);
    const doc = { target, kind, status: cur.status || '', note: cur.note || '', ...meta, ...patch, ...headOfVerdict(target, cur, patch), updatedAt: new Date().toISOString() };

    try {

        if (this.pending.get(target) === doc) this.pending.delete(target);
        if (!ok) break;

    } finally { this.inflight.delete(target); }
  },

function headOfVerdict(target, cur, patch) {

    const lines = D && D[claim.path] ? ReviewCoverage.changedSince(claim, cur, C.pr.head, C.lineage, D[claim.path]) : 0;

    <div class="seg" role="group" aria-label="${esc(k.label)}">

    </div>
    <span class="via-note" data-via-note hidden></span>
    <span class="since-note" data-since-note hidden></span>
    <textarea data-note placeholder="Your note: what to change, what to ask, what you checked" ${noteOpen ? '' : 'hidden'} aria-label="Note">${esc(cur.note || '')}</textarea>

}

DiagramKit.attachTracing(document);
document.addEventListener('click', e => {

/* ---------- Figures ---------- */
const plain = s => String(s == null ? '' : s).replace(/`/g, '');
function figSvg(f) {
  const safe = String(f.svg || '').replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*')/gi, '');
  return `<div class="fig-scroll fsvg">${safe}</div>`;
}

function withoutItsSide(title, label) {
  const rest = String(title || '').replace(new RegExp('^\\s*`?' + label + '`?\\s*[:—–-]\\s*', 'i'), '').trim();
  if (!rest || plain(rest).toLowerCase() === label.toLowerCase()) return '';
  return rest.charAt(0).toUpperCase() + rest.slice(1);
}
function figCompare(f) {
  const said = (sub, label) => (sub && withoutItsSide(sub.title, label) ? ' · ' + md(withoutItsSide(sub.title, label), true) : '');
  const side = (label, sub) => `<div class="fside"><div class="eyebrow">${label}${said(sub, label)}</div>${sub ? figureBody(sub) : '<div class="muted small">Nothing.</div>'}${sub && sub.caption ? `<div class="fig-caption md small">${md(sub.caption)}</div>` : ''}</div>`;
  return `<div class="fcompare">${side('Before', f.before)}${side('After', f.after)}</div>`;
}

const FIGURES = { svg: figSvg, compare: figCompare };
let figureSeq = 0;
function diagramLink(link) {
  if (link.startsWith('chapter:')) return { href: '#tour-' + link.slice('chapter:'.length), label: 'Open its chapter' };
  const w = parseWhere(link);
  if (w) return { href: '#files', label: `Open ${link}`, attributes: { 'data-open': w.path, 'data-line': w.line } };
  return /^(https?:|#)/.test(link) ? { href: link, label: `Open ${link}` } : null;
}
function figDiagram(f) {
  if (!f.scene) return '<div class="fig-error">This diagram could not be laid out. The build names what is wrong with it.</div>';
  const remarks = (f.remarks || []).length ? `<ul class="dk-remarks">${f.remarks.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '';
  return `<div class="fig-scroll" style="--natural-width:${f.scene.width}px">${DiagramKit.svgOf(f.scene, { uid: f.id, title: plain(f.title), resolveLink: diagramLink })}</div>${f.legend || ''}${f.symbols || ''}${remarks}`;
}
function figSelfDrawn(f) {
  const remarks = (f.remarks || []).length ? `<ul class="dk-remarks">${f.remarks.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '';
  return `<div class="dk-drawn">${DiagramKit.NOTATIONS[f.kind].htmlOf(f, { resolveLink: diagramLink })}</div>${f.symbols || ''}${remarks}`;
}
async function liveDiagram(spec) {
  const live = DiagramKit.live;
  if (!live) return '<div class="fig-error">This page was built without the layout engine, so it cannot draw this diagram. A view that draws one calls <code>api.diagram</code> or <code>api.drawInto</code>.</div>';
  const problems = live.problemsIn(spec);
  if (problems.length) return `<div class="fig-error">This diagram could not be drawn:<ul>${problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
  const scene = await live.laidOut(spec);
  return figureHtml({ ...spec, ...(scene ? { scene, legend: DiagramKit.legendOf(scene) } : {}), remarks: live.remarksOn(spec), symbols: live.symbolsOf(spec, scene) });
}
async function drawInto(element, spec) {
  element.setAttribute('data-drawing', '');
  try { element.innerHTML = await liveDiagram(spec); } catch (e) { element.innerHTML = `<div class="fig-error">This diagram could not be drawn: ${esc(e.message)}</div>`; }
  element.removeAttribute('data-drawing');
}
function figureBody(f) {
  const drawsItself = f && (DiagramKit.NOTATIONS || {})[f.kind];
  const draw = drawsItself ? figSelfDrawn : f && 'scene' in f ? figDiagram : FIGURES[f && f.kind];
  if (!draw) return `<div class="fig-error">No renderer for a figure of kind “${esc(f && f.kind)}”.</div>`;
  try { return draw(f, ++figureSeq); } catch (e) { return `<div class="fig-error">This figure could not be drawn: ${esc(e.message)}</div>`; }
}
const WIDEST_IN_HALF_A_ROW = 430;
function spansTheRow(f) {
  if (f.wide || ['compare', 'sequence-diagram', 'timeline'].includes(f.kind)) return true;
  return Boolean(f.scene) && f.scene.width > WIDEST_IN_HALF_A_ROW;
}
function figureHtml(f, opts = {}) {
  if (!f) return '';
  const wide = spansTheRow(f);
  const body = figureBody(f);
  return `<figure class="fig${opts.compact ? ' compact' : ''}${wide && !opts.compact ? ' wide' : ''}" id="fig-${esc(f.id || '')}">${f.title ? `<figcaption class="fig-title">${md(f.title, true)}</figcaption>` : ''}<div class="fig-body">${body}</div>${f.caption ? `<div class="fig-caption md small">${md(f.caption)}</div>` : ''}</figure>`;
}
function figureViews() {

function squarify(items, r) {
  const out = [];
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!total || r.w <= 0 || r.h <= 0) return out;
  const scale = (r.w * r.h) / total;
  const vals = items.map(i => ({ ...i, a: i.v * scale }));
  const worst = (row, len) => { const s = row.reduce((a, b) => a + b.a, 0); let mx = 0, mn = Infinity; row.forEach(x => { mx = Math.max(mx, x.a); mn = Math.min(mn, x.a); }); return Math.max(len * len * mx / (s * s), (s * s) / (len * len * mn)); };
  const lay = (row, rc) => {
    const s = row.reduce((a, b) => a + b.a, 0);
    if (rc.w >= rc.h) { const cw = s / rc.h; let y = rc.y; row.forEach(it => { const h = it.a / cw; out.push({ ...it, x: rc.x, y, w: cw, h }); y += h; }); return { x: rc.x + cw, y: rc.y, w: rc.w - cw, h: rc.h }; }
    const rh = s / rc.w; let x = rc.x; row.forEach(it => { const w = it.a / rh; out.push({ ...it, x, y: rc.y, w, h: rh }); x += w; }); return { x: rc.x, y: rc.y + rh, w: rc.w, h: rc.h - rh };
  };
  let rc = { ...r }, row = [], i = 0;
  while (i < vals.length) {
    const len = Math.min(rc.w, rc.h);
    if (!row.length || worst([...row, vals[i]], len) <= worst(row, len)) { row.push(vals[i]); i++; }
    else { rc = lay(row, rc); row = []; }
  }
  if (row.length) lay(row, rc);
  return out;
}

    ${body ? `<div class="commit-msg">${esc(body)}</div>` : ''}
    <div class="pager-row small"><button type="button" class="btn" data-step-commit="-1" ${prev ? '' : 'disabled'}>← Previous</button><button type="button" class="btn" data-step-commit="1" ${next ? '' : 'disabled'}>Next →</button><span class="muted">or press <kbd>k</kbd> and <kbd>j</kbd></span></div>
    ${c.merge ? '' : `<div class="row small"><span data-commit-summary="${esc(sha)}"></span><button type="button" class="loc" data-next-unread title="Jump to the next line still to read (n)">Next unread</button><kbd>n</kbd><span class="read-key"><span><i class="k-unread"></i>still to read</span><span><i class="k-read"></i>read</span><span><i class="k-superseded"></i>superseded, not counted</span></span></div>
    ${ctl('commit:' + sha, 'commit', { label: `Commit ${shortSha(sha)}: ${c.subject}`, where: shortSha(sha) })}`}</div>`;
  if (c.merge) return head + `<div class="empty">A merge commit: it brings in changes from elsewhere, so it is not reviewed here.</div>`;
  if (!d || !window.ReviewCoverage) return head + `<div class="loading">Loading the commit…</div>`;
  const files = d.files.map(f => `<div class="code tall"><div class="code-head"><span class="path">${f.previous ? `${esc(short(f.previous))} → ` : ''}${esc(short(f.path))}</span><span class="muted tnum">+${fmt(f.add)} −${fmt(f.del)}</span>${D && D[f.headPath] ? `<button class="loc" data-open="${esc(f.headPath)}" data-line="" data-side="new">in All files</button>` : ''}</div>${f.binary ? '<div class="muted small" style="padding:12px 14px">A binary file.</div>' : `<table>${commitRowsHtml(d, f)}</table>`}</div>`).join('');
  return head + `<div class="commit-files" id="commit-code">${files || '<div class="empty">This commit changes no file content.</div>'}</div>`;
}
function selectCommit(sha) {
  selectedCommit = sha;
  $$('.cm-item').forEach(x => x.setAttribute('aria-current', String(x.dataset.commit === sha)));
  $('#commit-pane').innerHTML = commitPane(sha);
  refreshControls();
  $('#commit-pane').scrollIntoView({ block: 'start' });
  const cur = $('.cm-item[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function stepCommit(by) {
  const target = C.commits[commitIndex(selectedCommit) + by];
  if (target) selectCommit(target.sha);
}
after.commits = () => {
  $$('.cm-item').forEach(b => b.addEventListener('click', () => selectCommit(b.dataset.commit)));
  const cur = $('.cm-item[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
};
document.addEventListener('click', e => {
  const step = e.target.closest('[data-step-commit]');
  if (step) { stepCommit(+step.dataset.stepCommit); return; }
  const go = e.target.closest('[data-goto-commit]');
  if (!go) return;
  selectedCommit = go.dataset.gotoCommit;
  if (location.hash !== '#commits') location.hash = 'commits'; else render();
});
document.addEventListener('keydown', e => {
  if (currentRoute !== 'commits' || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest('input, textarea, select'))) return;
  if (e.key === 'j') stepCommit(1);
  else if (e.key === 'k') stepCommit(-1);
});
async function loadCommits() {
  try {
    const data = window.__EXPLORE_COMMITS || await (await fetch('commits.json')).json();
    COMMITS = data.commits || [];
    COMMIT = Object.fromEntries(COMMITS.map(c => [c.sha, c]));
    ORIGINS = window.ReviewCoverage ? ReviewCoverage.originsOf(COMMITS) : {};
    if (currentRoute === 'commits' || currentRoute === 'files') render();
    onStateChange();
  } catch (e) {
    $$('#commit-pane .loading').forEach(el => { el.textContent = 'The commits could not be loaded. Reload to try again.'; });
  }
}

/* Terms */
function vTerms() {
  const all = C.chapters.flatMap(ch => (ch.domain || []).map(d => ({ ...d, ch })));
  const seen = new Map();
  all.forEach(t => { const k = t.term.toLowerCase(); if (!seen.has(k)) seen.set(k, t); });
  const terms = [...seen.values()].sort((a, b) => a.term.localeCompare(b.term, 'en-GB'));
  return `<div class="view-head"><div class="eyebrow">Domain terms</div><h1>The language of the change</h1><p class="lede">${terms.length} terms the PR introduces or leans on, as the code names them. One term per concept; the tour uses them verbatim.</p></div>
    <div class="glossary">${terms.map(t => `<div class="term"><b>${esc(t.term)}</b><div class="small">${md(t.meaning, true)}</div><div class="row small">${t.code ? `<code>${esc(t.code)}</code>` : ''}<span class="spacer"></span><a href="#tour-${t.ch.id}">${esc(t.ch.title)}</a></div></div>`).join('')}</div>`;
}

/* Notes */
function notesMarkdown() {
  const docs = [...Store.docs.values()].filter(d => d.status || d.note);
  const label = (kind, s) => (KINDS[kind]?.opts.find(o => o[0] === s) || [s, s])[1];
  const dec = Store.get('decision');
  let out = `# PR ${C.pr.number} review notes\n\n${C.pr.head ? `Head: ${shortSha(C.pr.head)}\n\n` : ''}Verdict: ${dec.status ? label('decision', dec.status) : 'undecided'}${recordedEarlier(dec) ? ` (recorded at ${shortSha(dec.head)}, before the pull request moved)` : ''}\n${dec.note ? '\n' + dec.note + '\n' : ''}`;
  const section = (title, kinds, order) => {
    const ds = docs.filter(d => kinds.includes(d.kind) && d.target !== 'decision');
    if (!ds.length) return;
    out += `\n## ${title}\n\n`;
    const sorted = ds.sort((a, b) => (order ? order.indexOf(a.status) - order.indexOf(b.status) : 0) || String(a.target).localeCompare(String(b.target)));
    sorted.forEach(d => { out += `- [${d.status ? label(d.kind, d.status) : 'note'}] ${d.label || d.target}${d.where ? ` (${d.where})` : ''}${recordedEarlier(d) ? ` — recorded at ${shortSha(d.head)}, before the pull request moved` : ''}${d.note ? `\n  ${d.note.replace(/\n/g, '\n  ')}` : ''}\n`; });
  };
  section('Design decisions', ['design'], ['disagree', 'question', 'agree', '']);
  section('Findings', ['finding'], ['block', 'fix-now', 'follow-up', 'reject', '']);
  section('Chapters', ['chapter'], ['blocking', 'concerns', 'understood', '']);
  section('Invariants', ['invariant'], ['issue', 'question', 'ok', '']);
  section('Removal sites', ['ledger'], ['issue', 'question', 'ok', '']);
  section('Tour stops', ['stop'], ['issue', 'question', 'ok', '']);
  section('Files', ['file'], ['issue', 'ok', 'skip', '']);
  section('Commits', ['commit'], ['issue', 'ok', 'skip', '']);
  out += linesReadMarkdown();
  return out;
}
function linesReadMarkdown() {
  const recorded = recordedClaims();
  const covs = C.files.map(f => [f.path, coverageOf(f.path, recorded)]);
  if (!covs.every(([, cov]) => cov)) return '';
  const read = covs.reduce((n, [, cov]) => n + cov.read, 0), changed = covs.reduce((n, [, cov]) => n + cov.changed, 0);
  let out = `\n## Lines read\n\n${fmt(read)} of ${plural(changed, 'changed line')} read.\n`;
  const outstanding = covs.filter(([, cov]) => cov.state !== 'read');
  if (outstanding.length) out += '\nStill to read:\n\n' + outstanding.map(([path, cov]) => `- ${path}: ${cov.changed ? `${fmt(cov.read)} of ${fmt(cov.changed)} read; unread ${cov.unread.map(rangeText).join(', ')}` : 'not reviewed'}\n`).join('');
  return out;
}
function vNotes() {
  const n = [...Store.docs.values()].filter(d => d.kind !== 'lines' && (d.status || d.note)).length;
  return `<div class="view-head"><div class="eyebrow">Your notes</div><h1>Everything you've recorded</h1>
    <p class="lede">${plural(n, 'item')} with a verdict or a note. ${Store.mode === 'db' ? 'They are saved with this artifact, so Claude Code can read them back: ask it to turn them into PR comments, or to start a respond-to-pr pass from them.' : 'They are saved in this browser only.'}</p></div>
    <div class="row"><button class="btn primary" id="copy-notes" type="button">Copy as Markdown</button><span class="small muted" id="copy-status" aria-live="polite"></span></div>
    <textarea class="copy-area" id="notes-md" readonly aria-label="Notes as Markdown">${esc(notesMarkdown())}</textarea>`;
}
after.notes = () => {
  $('#copy-notes').addEventListener('click', async () => {
    const ta = $('#notes-md');
    try { await navigator.clipboard.writeText(ta.value); $('#copy-status').textContent = 'Copied.'; }
    catch (e) { ta.focus(); ta.select(); $('#copy-status').textContent = 'Selected. Press Ctrl+C or ⌘C to copy.'; }
  });
};

/* ---------- Extension API ---------- */
const source = () => (C.findingsMeta || {}).source || 'the earlier review';
const api = () => ({ content: C, diff: D, commits: COMMIT, md, esc, fmt, plural, figure: figureHtml, diagram: liveDiagram, drawInto, codeSlice, locBtn, whereBtn, testRef, sevChip, ctl, store: Store, kinds: KINDS, rerender: render, openFile });
window.ExplorePR = {
  registerView(view) {
    if (!/^[A-Za-z0-9-]+$/.test(view.id || '')) throw new Error(`ExplorePR view id must be letters, digits and hyphens: ${view.id}`);
    customViews.push(view);
    if (C) { renderRail(); if (location.hash === '#' + view.id) render(); }
  },
  registerKind(name, spec) { KINDS[name] = spec; },
  routes: () => (C ? routes().map(r => r[0]) : []),
  customViews: () => customViews.map(view => view.id),
  figureViews: () => (C ? figureViews() : []),
  get api() { return api(); },
};

/* ---------- Boot ---------- */
async function boot() {
  try {
    C = window.__EXPLORE_CONTENT || await (await fetch('content.json')).json();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty">The content could not be loaded. Reload the page to try again.</div>`;
    return;
  }
  index();
  GH = C.pr.repoUrl || '';
  $('#pr-id').textContent = '#' + C.pr.number;
  $('#pr-title').textContent = C.pr.title || '';
  render();
  Store.init();
  try {
    D = window.__EXPLORE_DIFF || await (await fetch('diff.json')).json();
    if (currentRoute === 'files') render(); else fillPendingSlices();
    onStateChange();
    if (C.commits.length) loadCommits();
  } catch (e) {
    $$('[data-pending-slice]').forEach(el => { el.innerHTML = '<div class="muted small" style="padding:12px">The code could not be loaded. Reload to try again.</div>'; });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else setTimeout(boot);
})();
</script>
