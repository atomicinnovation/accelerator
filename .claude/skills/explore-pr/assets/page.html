<style>
/* Layout: a review console. Left rail is the review's own directory tree; the main column reads like an annotated listing, prose beside code. */

  --f-body: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

}

  :root:not([data-theme="light"]) {
    --bg: #0d1015; --panel: #151a22; --panel-2: #1b212b; --ink: #e4e8ef; --ink-2: #a8b2c2; --ink-3: #7d889b;
    --rule: #283041; --accent: #8ba5ff; --accent-ink: #0d1015; --accent-soft: #1d2747;
    --add-bg: #0f2a19; --add-mark: #4cc27a; --del-bg: #351719; --del-mark: #ff7f76; --hl-row: #3a3215;
    --ok: #4cc27a; --warn: #e2b23f; --bad: #ff7f76; --info: #8ba5ff; --none: #8a94a6;
    --sev-major: #ff8c6b; --sev-minor: #e2b23f; --sev-sugg: #9aa4b6;
    --risk-high: #b7d3f6; --risk-med: #6da7ec; --risk-low: #2a78d6; --risk-skim: #184f95;
    --risk-high-ink: #0b1a2e; --risk-med-ink: #0b1a2e; --risk-low-ink: #ffffff; --risk-skim-ink: #e4e8ef;
    --tok-kw: #ff8fb0; --tok-title: #8cc3ff; --tok-str: #8fd19e; --tok-com: #7d889b; --tok-num: #f0b65a; --tok-meta: #c5a8ff; --tok-built: #6fd2db;

  --bg: #0d1015; --panel: #151a22; --panel-2: #1b212b; --ink: #e4e8ef; --ink-2: #a8b2c2; --ink-3: #7d889b;
  --rule: #283041; --accent: #8ba5ff; --accent-ink: #0d1015; --accent-soft: #1d2747;
  --add-bg: #0f2a19; --add-mark: #4cc27a; --del-bg: #351719; --del-mark: #ff7f76; --hl-row: #3a3215;
  --ok: #4cc27a; --warn: #e2b23f; --bad: #ff7f76; --info: #8ba5ff; --none: #8a94a6;
  --sev-major: #ff8c6b; --sev-minor: #e2b23f; --sev-sugg: #9aa4b6;

}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); text-underline-offset: 2px; }
code, kbd, .mono { font-family: var(--f-mono); font-size: .86em; }
:not(pre) > code { background: var(--panel-2); border-radius: 4px; padding: .05em .32em; overflow-wrap: anywhere; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
h1 { font-size: 1.85rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
.prose { max-width: 72ch; display: grid; gap: .7em; align-content: start; }
.prose ul, .prose ol { margin: 0; padding-left: 1.25em; display: grid; gap: .3em; }
.prose pre, .md pre { background: var(--panel-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; font-size: 13px; line-height: 1.45; }
.prose pre code, .md pre code { background: none; padding: 0; font-size: inherit; }
.md { display: grid; gap: .55em; min-width: 0; align-content: start; }
.md > * { margin: 0; }
.md > :is(p, ul, ol, blockquote, h1, h2, h3, h4) { max-width: 72ch; }
.md ul, .md ol { padding-left: 1.2em; display: grid; gap: .25em; }
.eyebrow { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--rule);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-inner { min-height: var(--top-min-h); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 8px; }
.pr-id { font-family: var(--f-mono); font-weight: 600; font-size: 13px; background: var(--ink); color: var(--panel); border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
.pr-title { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; min-width: 0; flex: 1 1 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.meter { display: grid; gap: 3px; min-width: 92px; }
.meter-label { font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.meter-bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.meter-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.decision-chip { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--rule); white-space: nowrap; }

/* Shell */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--top-h)); }
.rail { border-right: 1px solid var(--rule); padding: 18px 10px 40px max(10px, env(safe-area-inset-left, 0px)); position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); align-self: start; max-height: calc(100vh - var(--top-h)); overflow-y: auto; }
.rail-group { display: grid; gap: 1px; margin-bottom: 14px; }
.rail-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 6px; }
.rail a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink-2); padding: 6px 10px; border-radius: 6px; font-size: 14px; min-width: 0; }
.rail a:hover { background: var(--panel-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail a .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail a .num { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.rail a.sub { padding-left: 22px; font-size: 13.5px; }
.rail-path { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); padding: 0 10px 10px; overflow-wrap: anywhere; }
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, 3vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 3vw); }
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.view > *, .section > *, .stack > *, .grid-2 > *, .grid-3 > * { min-width: 0; }
.view-head { display: grid; gap: 8px; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 70ch; }

/* Generic blocks */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.section > h2, .section > .sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); }
.loc { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.loc:hover { text-decoration: underline; }
.loc.act { font-family: var(--f-body); font-size: 12px; font-weight: 500; }
#file-pane:focus, #commit-pane:focus { outline: none; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border-radius: 999px; padding: 2px 8px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.5; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }
.c-major, .c-high, .c-bad, .c-block, .c-blocking, .c-issue, .c-disputed, .c-fail { color: var(--bad); }
.c-major { color: var(--sev-major); }
.c-minor, .c-medium, .c-warn, .c-fix-now, .c-concerns, .c-question, .c-partly, .c-cancelled { color: var(--warn); }
.c-minor { color: var(--sev-minor); }
.c-suggestion, .c-low, .c-none, .c-reject, .c-drop, .c-skip, .c-unverified, .c-skipped { color: var(--sev-sugg); }
.c-ok, .c-confirmed, .c-understood, .c-approve, .c-pass, .c-yes { color: var(--ok); }
.c-info, .c-follow-up { color: var(--info); }
.lens { font-size: 11.5px; color: var(--ink-3); font-family: var(--f-mono); }

/* Review controls */
.ctl { display: grid; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.seg button:hover { border-color: var(--ink-3); color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--panel); border-color: transparent; font-weight: 600; }
.seg button[aria-pressed="true"].t-ok { background: var(--ok); }
.seg button[aria-pressed="true"].t-warn { background: var(--warn); }
.seg button[aria-pressed="true"].t-bad { background: var(--bad); }
.seg button[aria-pressed="true"].t-info { background: var(--info); }
.seg button[aria-pressed="true"].t-none { background: var(--none); }
.seg .note-toggle { border-style: dashed; }
.ctl textarea { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); }
.ctl .saved { font-size: 11.5px; color: var(--ink-3); }
.ro .seg button, .ro textarea { pointer-events: none; opacity: .75; }
.ctl.via .seg button.t-ok[aria-pressed="false"] { border-style: dashed; border-color: var(--ok); color: var(--ok); }
.via-note { font-size: 11.5px; color: var(--ink-3); }
.since-note { font-size: 11.5px; color: var(--warn); }

/* Banners */
.banner { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); }
.banner strong { color: var(--ink); }

/* Code */
.code { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); overflow: auto; max-height: 560px; min-width: 0; }
.code.tall { max-height: none; overflow-x: auto; }
.code-head { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--rule); background: var(--panel-2); font-family: var(--f-mono); font-size: 12px; position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
.code-head .path { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.code-head a { margin-left: auto; font-family: var(--f-body); font-size: 12px; }
.code table { border-collapse: collapse; width: 100%; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; }
.code td { padding: 0 8px; vertical-align: top; }
.code td.ln { width: 1%; min-width: 38px; white-space: nowrap; text-align: right; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums; padding: 0 6px; }
.code td.mk { width: 1%; padding: 0 4px; user-select: none; color: var(--ink-3); }
.code td.src { white-space: pre; padding-right: 16px; }
.code tr.add { background: var(--add-bg); }
.code tr.add td.mk { color: var(--add-mark); font-weight: 600; }
.code tr.del { background: var(--del-bg); }
.code tr.del td.mk { color: var(--del-mark); font-weight: 600; }
.code tr.focus td.ln { color: var(--ink); font-weight: 600; }
.code tr.flash { background: var(--hl-row) !important; }
.code tr.unread td.ln:first-child { box-shadow: inset 4px 0 0 var(--warn); }
.code tr.read td.ln:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.code tr.read td.ln:first-child::before { content: "✓"; float: left; padding-left: 6px; color: var(--ok); font-weight: 700; }
.code tr.add.read { background: color-mix(in srgb, var(--add-bg) 40%, var(--panel)); }
.code tr.del.read { background: color-mix(in srgb, var(--del-bg) 40%, var(--panel)); }
.code tr.read td.src, .code tr.read td.mk { opacity: .6; }
.read-key { display: inline-flex; gap: 12px; align-items: center; color: var(--ink-3); }
.read-key i { display: inline-block; width: 4px; height: 12px; border-radius: 1px; margin-right: 5px; vertical-align: -1px; }
.read-key .k-unread { background: var(--warn); }
.read-key .k-read { background: var(--ok); }
.read-key .k-superseded { background: var(--none); }
.code tr[data-lk] td.ln { cursor: pointer; }
.code tr[data-lk] td.ln:hover { color: var(--ink); text-decoration: underline; }
.code tr.superseded.unread td.ln:first-child { box-shadow: inset 4px 0 0 var(--none); }
.code tr.superseded td.src { font-style: italic; }
.code tr.blk td { padding: 2px 10px 2px 14px; background: var(--panel); font-family: var(--f-body); font-size: 11.5px; line-height: 1.6; }
.code tr.blk button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.commit-msg { white-space: pre-wrap; font-size: 14px; color: var(--ink-2); max-width: 80ch; overflow-wrap: anywhere; }
.fl-item.cm-item .nm, #nav-tree .nav-commit .nm { direction: ltr; font-family: var(--f-body); font-weight: 600; }
.commit-file-ctl { padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--panel); }
.commit-files { display: grid; gap: 14px; }
.pager-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pager-row .btn[disabled] { opacity: .45; cursor: default; }
kbd { border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11.5px; }
.code tr.gap td { background: var(--panel-2); color: var(--ink-3); font-family: var(--f-body); font-size: 12px; padding: 3px 10px; }
.code tr.gap button { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
.code tr.anno td { padding: 8px 12px 10px 60px; background: var(--panel); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); white-space: normal; font-family: var(--f-body); font-size: 13.5px; }
.anno-list { display: grid; gap: 8px; max-width: 90ch; }
.anno-item { display: grid; gap: 4px; border-left: 3px solid var(--accent); padding-left: 10px; }
.anno-item.k-ledger { border-color: var(--bad); }
.anno-item.k-finding { border-color: var(--warn); }
.gut { display: inline-block; font-size: 10px; font-weight: 700; font-family: var(--f-body); border-radius: 3px; padding: 0 4px; margin-left: 4px; color: var(--panel); background: var(--accent); vertical-align: 1px; }
.gut.k-ledger { background: var(--bad); }
.gut.k-finding { background: var(--warn); }
.hljs-keyword, .hljs-selector-tag, .hljs-section { color: var(--tok-kw); }
.hljs-title, .hljs-type, .hljs-title.class_, .hljs-title.function_ { color: var(--tok-title); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-char { color: var(--tok-str); }
.hljs-comment, .hljs-quote, .hljs-doctag { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--tok-num); }
.hljs-meta, .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: var(--tok-meta); }
.hljs-built_in, .hljs-selector-class, .hljs-name { color: var(--tok-built); }
.hljs-emphasis { font-style: italic; } .hljs-strong { font-weight: 600; }

/* Tour */
.chapter-list { display: grid; gap: 10px; counter-reset: ch; }
.chapter-card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: start; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; }
.chapter-card:hover { border-color: var(--accent); }
.ch-num { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.chapter-card .meta { display: grid; gap: 4px; justify-items: end; text-align: right; }
.stop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; padding-block: 18px; border-top: 1px solid var(--rule); }
.stop-note { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 12px); min-width: 0; }
.fit { display: grid; gap: 4px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; }
.stop-figure, .stop-head { grid-column: 1 / -1; }
.stop-num { font-family: var(--f-mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.check { border-left: 3px solid var(--warn); padding: 2px 0 2px 10px; font-size: 14px; display: grid; gap: 6px; }
.check .eyebrow { color: var(--warn); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checks li { display: grid; gap: 3px; }
.checks .problem { color: var(--ink-2); }
.checks .problem .eyebrow { color: var(--ink-3); margin-right: 4px; }
.carries { display: grid; gap: 6px; }
.carried { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: inherit; text-decoration: none; font-size: 13.5px; }
.carried:hover { border-color: var(--accent); }
.carried-label { display: flex; align-items: baseline; gap: 0; min-width: 0; }
.carried .eyebrow { color: var(--accent); }
.carried.k-risk .eyebrow { color: var(--bad); }
.carried.k-invariant .eyebrow { color: var(--ok); }
.carried .carried-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.design-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.design-strip .carried { max-width: 100%; }
.introduced { gap: 8px; }
.finding-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.finding-list .finding-title { flex: 1; min-width: 0; }
.excerpt { margin: 0; display: grid; gap: 6px; min-width: 0; }
.article-aside { border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; padding: 8px 12px; display: grid; gap: 6px; }
.aside-ref { display: flex; gap: 8px; align-items: center; min-width: 0; }
.aside-ref .carried { flex: 1; min-width: 0; }
.why, .stop-risk { display: grid; gap: 4px; }
.stop-risk { border-left: 3px solid var(--bad); padding: 2px 0 2px 10px; font-size: 14px; }
.stop-risk .eyebrow { color: var(--bad); }
.anno-item.k-focus { border-color: var(--accent); }
.code { container-type: inline-size; }
.code tr.point .anno-list { position: sticky; left: 60px; max-width: min(90ch, calc(100cqw - 76px)); }
.ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--panel); }
.ba > div { padding: 12px 14px; border-bottom: 1px solid var(--rule); min-width: 0; }
.ba > div:nth-child(odd) { border-right: 1px solid var(--rule); }
.ba .ba-aspect { grid-column: 1 / -1; background: var(--panel-2); font-weight: 600; font-size: 13.5px; padding: 7px 14px; }
.ba .eyebrow { margin-bottom: 4px; }
.inv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; padding: 14px 0; border-top: 1px solid var(--rule); }
.inv:first-child { border-top: 0; }
.glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.term { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.term b { font-family: var(--f-display); font-weight: 600; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 10px 14px; display: grid; gap: 2px; min-width: 0; max-width: 48%; }
.pager a:hover { border-color: var(--accent); }

/* Findings */
.finding { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.finding-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.finding-id { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.verdict-box { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
details > summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
details[open] > summary { margin-bottom: 8px; }
.filters { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 8px); z-index: 5; }
.filters label { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.filters select, .filters input[type="search"] { font: inherit; font-size: 13.5px; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); }
.count-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filters-toggle { display: none; }
.view :is([id^="stop-"], [id^="dec-"], [id^="abs-"], [id^="inv-"], [id^="risk-"], [id^="f-"], [id^="l-"]) { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + var(--filters-h) + 16px); }

/* Verdict marks */
.mark { display: inline-grid; place-items: center; flex: none; width: 15px; height: 15px; margin-right: 6px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; color: var(--panel); font: 700 10px/1 var(--f-body); vertical-align: -2px; text-decoration: none; }
.mark:not([data-tone]) { display: none; }
.mark[data-tone="ok"] { background: var(--ok); border-color: var(--ok); }
.mark[data-tone="warn"] { background: var(--warn); border-color: var(--warn); }
.mark[data-tone="bad"] { background: var(--bad); border-color: var(--bad); }
.mark[data-tone="info"] { background: var(--info); border-color: var(--info); }
.mark[data-tone="none"] { background: var(--none); border-color: var(--none); }
.rail a .mark { margin-right: 0; }

/* Peeks */
.peek { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; min-width: 0; text-align: left; font-size: 15px; white-space: normal; }
.peek > article, .peek > .inv, .peek > .table-wrap { border: 0; padding: 0; background: none; }
.peek-pop { position: absolute; z-index: 45; width: min(560px, calc(100vw - 32px)); overflow-y: auto; overscroll-behavior: contain; box-shadow: 0 14px 36px rgba(0, 0, 0, .22); }
.peek-inline { flex-basis: 100%; width: 100%; margin: 10px 0; border-left: 3px solid var(--accent); }
.peek-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; border-top: 1px solid var(--rule); padding-top: 8px; }
.peek-close { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink-2); }

/* Map */
.tm-wrap { position: relative; width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; touch-action: manipulation; }
.tm-group { position: absolute; }
.tm-group-label { position: absolute; left: 6px; top: 3px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm-tile { position: absolute; border-radius: 3px; overflow: hidden; cursor: pointer; padding: 3px 5px; font-size: 11px; line-height: 1.25; border: 0; text-align: left; font-family: var(--f-mono); }
.tm-tile:hover, .tm-tile:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 2; }
.tm-tile span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-high { background: var(--risk-high); color: var(--risk-high-ink); }
.r-medium { background: var(--risk-med); color: var(--risk-med-ink); }
.r-low { background: var(--risk-low); color: var(--risk-low-ink); }
.r-skim { background: var(--risk-skim); color: var(--risk-skim-ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.keys-help { position: fixed; z-index: 70; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.keys-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.keys-head h2 { margin: 0; font-size: 1.1rem; }
.keys-groups { display: grid; gap: 16px 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.keys-groups h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.keys-groups dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 13px; align-items: baseline; }
.keys-groups dt { white-space: nowrap; }
.keys-groups dd { margin: 0; color: var(--ink-2); }
.keys-advance { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
.code tr.chunk-cursor td.mk, .code tr.chunk-cursor td.src { background-image: linear-gradient(color-mix(in srgb, var(--accent) 13%, transparent), color-mix(in srgb, var(--accent) 13%, transparent)); }
.code tr.chunk-cursor td.src { box-shadow: inset -4px 0 0 var(--accent); }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 14px; align-items: center; max-width: min(560px, calc(100vw - 32px)); background: var(--ink); color: var(--panel); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 14px; font-size: 13.5px; }
.toast .loc { color: var(--panel); font-weight: 600; text-decoration: underline; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 13px; max-width: 340px; display: grid; gap: 4px; }
.budget { display: flex; height: 30px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--panel); }
.budget > div { display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; min-width: 0; }

/* Files */
.files-layout { display: grid; grid-template-columns: var(--nav-w, minmax(240px, 320px)) minmax(0, 1fr); gap: 18px; align-items: start; }
.file-list { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 12px); max-height: calc(100vh - var(--top-h) - 32px); overflow-y: auto; display: grid; gap: 2px; }
.file-list input { font: inherit; font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); margin-bottom: 6px; width: 100%; }
.fl-group { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 6px 4px; }
.fl-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-family: var(--f-mono); }
.fl-item:hover { background: var(--panel-2); }
.fl-item[aria-current="true"] { background: var(--accent-soft); }
.fl-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.fl-item .ct { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cov { width: 28px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; display: block; }
.cov i { display: block; height: 100%; width: 0; background: var(--ok); }
.cov.s-issue i { background: var(--bad); }
.nav-drawer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 12px); min-width: 0; }
.nav-drawer > summary { display: none; }
.nav-drawer .file-list { position: static; }
.nav-prefs { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 0 2px 6px; }
.nav-prefs select { font: inherit; padding: 2px 4px; border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); color: var(--ink); }
.facets { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; margin: 0 2px 6px; --pill-h: 22px; }
.facet { height: var(--pill-h); }
.facet > summary { list-style: none; cursor: pointer; font-size: 12px; box-sizing: border-box; height: var(--pill-h); line-height: calc(var(--pill-h) - 2px); padding: 0 9px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); white-space: nowrap; }
.facet > summary::-webkit-details-marker { display: none; }
.facet > summary b { color: var(--accent); font-variant-numeric: tabular-nums; }
.facet > summary b.none { visibility: hidden; }
.facet.active > summary, .facet[open] > summary { border-color: var(--accent); color: var(--ink); }
.facet-opts { position: fixed; z-index: 40; display: grid; align-content: start; gap: 1px; padding: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); overflow-y: auto; }
.facet-opts [data-facet-count] { color: var(--ink-3); }
.nav-actions { display: inline-flex; gap: 10px; }
.nav-actions .loc[disabled] { opacity: .4; cursor: default; }
.facet-opts label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.facet-opts label:hover { background: var(--panel-2); }
.facet-opts label span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-list .facet-opts input { width: auto; margin: 0; }
.nav-count { margin: 0 2px 4px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.nav-line > :first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bulk-bar > :first-child { color: var(--ink); font-weight: 600; }
#navigator { display: flex; flex-direction: column; overflow: hidden; gap: 0; }
.nav-head { flex: none; padding-bottom: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
#nav-tree { display: grid; gap: 1px; align-content: start; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
#nav-tree .nav-row { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; }
#nav-tree .fl-item { position: relative; grid-template-columns: 14px 28px minmax(0, 1fr) auto; gap: 6px; padding: 3px 6px 3px calc(8px + var(--depth, 0) * 14px); font-size: 12px; }
#nav-tree .fl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#nav-tree .pick { margin: 0; visibility: hidden; cursor: pointer; }
#nav-tree .pick:focus-visible, #nav-tree.selecting .pick { visibility: visible; }
@media (hover: hover) { #nav-tree .nav-row:hover .pick { visibility: visible; } }
@media (hover: none) { #nav-tree .pick { visibility: visible; } }
#nav-tree .nm { direction: ltr; }
#nav-tree .nm .base, #nav-tree .nm .dir { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#nav-tree .nm .dir { direction: rtl; text-align: left; color: var(--ink-3); font-size: 10.5px; }
#file-pane, #commit-code { min-height: calc(100vh - var(--top-h) - 24px); align-content: start; }
#nav-tree .fl-item.stale { opacity: .5; }
.nav-group .nm { font-family: var(--f-body); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.chev { display: grid; place-items: center; width: 14px; height: 18px; color: var(--ink-3); }
.chev::before { content: ''; width: 0; height: 0; border-style: solid; border-width: 4px 0 4px 6px; border-color: transparent transparent transparent currentColor; transform: rotate(90deg); }
[aria-expanded="false"] > .chev::before { transform: none; }
#nav-tree .nav-commit .chev:hover { color: var(--ink); }
@media (hover: none) { #nav-tree .nav-commit .chev { width: 28px; height: 30px; margin: -6px -14px -6px -6px; } }
#nav-tree.show-risk .fl-item[data-risk]::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; background: var(--risk-edge, transparent); }
#nav-tree .fl-item[data-risk="high"], .risk-key .k-high { --risk-edge: var(--risk-high); }
#nav-tree .fl-item[data-risk="medium"], .risk-key .k-medium { --risk-edge: var(--risk-med); }
#nav-tree .fl-item[data-risk="low"], .risk-key .k-low { --risk-edge: var(--risk-low); }
#nav-tree .fl-item[data-risk="skim"], .risk-key .k-skim { --risk-edge: var(--risk-skim); }
.risk-key { display: inline-flex; gap: 2px; vertical-align: -1px; margin-left: 2px; }
.risk-key i { display: inline-block; width: 3px; height: 11px; border-radius: 1px; background: var(--risk-edge); }
.code td.src .cut { color: var(--ink-3); font-style: italic; font-family: var(--f-body); }
.nav-resizer { position: absolute; top: 0; bottom: 0; right: -13px; width: 8px; cursor: col-resize; border-radius: 4px; touch-action: none; }
.nav-resizer:hover, .nav-resizer:focus-visible, .nav-resizer.dragging { background: var(--accent-soft); box-shadow: inset 3px 0 0 -2px var(--accent), inset -3px 0 0 -2px var(--accent); outline: none; }
.rail, #nav-tree, html { scrollbar-width: none; }
.rail::-webkit-scrollbar, #nav-tree::-webkit-scrollbar, html::-webkit-scrollbar { display: none; }

/* Simulator */
.sim-layout { display: grid; grid-template-columns: minmax(250px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.listing td:nth-child(3) { white-space: nowrap; }
.listing .nm { overflow-wrap: anywhere; }
.sim-controls { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; }
.field > label, .field > .flabel { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field select, .field input[type="number"], .field input[type="text"] { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); width: 100%; min-width: 0; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets .btn { font-size: 12.5px; padding: 4px 10px; }
.presets .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.listing { font-family: var(--f-mono); font-size: 12.5px; width: 100%; border-collapse: collapse; }
.listing td, .listing th { padding: 4px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; text-align: left; }
.listing th { font-family: var(--f-body); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.listing tr.gone .nm { text-decoration: line-through; color: var(--bad); }
.listing tr.gone { background: var(--del-bg); }
.listing .why { font-family: var(--f-body); font-size: 12.5px; color: var(--ink-2); }
.listing .dir { color: var(--ink-3); }
.ruler { position: relative; height: 64px; margin: 14px 12px 0; }
.ruler .axis { position: absolute; left: 0; right: 0; top: 36px; height: 2px; background: var(--rule); }
.ruler .tick { position: absolute; top: 30px; width: 1px; height: 14px; background: var(--ink-3); }
.ruler .tlabel { position: absolute; top: 46px; font-size: 10.5px; color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; font-family: var(--f-mono); }
.ruler .mark { position: absolute; top: 6px; transform: translateX(-50%); font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.ruler .pin { position: absolute; top: 31px; width: 10px; height: 14px; transform: translateX(-50%); border-radius: 3px; }
.report { font-family: var(--f-mono); font-size: 12.5px; background: var(--panel-2); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; overflow-x: auto; }

/* Module map */

.tok { color: var(--ink-3); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); border: 1px dashed var(--rule); border-radius: 10px; }
.loading { padding: 40px 0; color: var(--ink-3); }
.copy-area { width: 100%; min-height: 320px; font-family: var(--f-mono); font-size: 12.5px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--ink); }
.general-notes { font-family: var(--f-body); font-size: 15px; min-height: 160px; resize: vertical; }

/* Figures */
.figs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); align-items: start; }
.fig { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.fig.compact { padding: 10px 12px; background: var(--bg); }
.fig-title { font-family: var(--f-display); font-weight: 600; font-size: 15px; line-height: 1.3; }
.fig-caption { color: var(--ink-2); }
.fig-error { color: var(--bad); font-size: 13px; }
.fig > *, .fside > *, .figs > * { min-width: 0; }
.fig-body { min-width: 0; overflow-x: auto; }
.fig-scroll { overflow-x: auto; min-width: 0; }
.fig-scroll svg { display: block; margin: 0 auto; height: auto; }
.fig-scroll svg.dk { max-width: 100%; min-width: calc(var(--natural-width) * .6); }
.fsvg svg { max-width: 100%; height: auto; color: var(--ink); }
.fig.wide { grid-column: 1 / -1; }
.abs-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.abs { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.abs.t-new { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.abs.t-changed { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.abs.t-removed { border-style: dashed; border-color: var(--bad); }
.dec-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }

<script>

/* ---------- Review state ---------- */
const KINDS = VerdictMarks.KINDS;
const Store = {
  mode: 'none', canWrite: true, version: 0, docs: new Map(), db: null, pending: new Map(), inflight: new Set(), reachable: true,

  get(t) { return this.docs.get(t) || {}; },

function squarify(items, r) {

    <section class="section"><h2>As Markdown</h2>
      <div class="row"><button class="btn primary" id="copy-notes" type="button">Copy as Markdown</button><span class="small muted" id="copy-status" aria-live="polite"></span></div>
      <textarea class="copy-area" id="notes-md" readonly aria-label="Notes as Markdown">${esc(notesMarkdown(entries))}</textarea></section>`;
}
function refreshNotes() {
  const entries = noteEntries();
  const typing = document.activeElement && document.activeElement.matches('#main textarea');
  if (cardedTargets(entries) !== renderedNoteCards && !typing) {
    const scrolled = window.scrollY;
    render();
    window.scrollTo(0, scrolled);
    return;
  }
  $('#notes-md').value = notesMarkdown(entries);
  $('#notes-count').textContent = itemCount(entries);
  const general = $('#general-notes'), saved = Store.get(GENERAL_NOTES).note || '';
  general.readOnly = !Store.canWrite;
  if (document.activeElement !== general && general.value !== saved) general.value = saved;
}
let generalNotesTimer = null;
const saveGeneralNotes = note => Store.put(GENERAL_NOTES, 'notes', { note }, { label: 'General notes' });
document.addEventListener('input', e => {
  if (e.target.id !== 'general-notes') return;
  clearTimeout(generalNotesTimer);
  generalNotesTimer = setTimeout(() => { generalNotesTimer = null; saveGeneralNotes(e.target.value); }, 700);
});
document.addEventListener('focusout', e => {
  if (e.target.id !== 'general-notes') return;
  clearTimeout(generalNotesTimer);
  generalNotesTimer = null;
  if ((Store.get(GENERAL_NOTES).note || '') !== e.target.value) saveGeneralNotes(e.target.value);
});
after.notes = () => {
  $('#copy-notes').addEventListener('click', async () => {
    const ta = $('#notes-md');
    try { await navigator.clipboard.writeText(ta.value); $('#copy-status').textContent = 'Copied.'; }
    catch (e) { ta.focus(); ta.select(); $('#copy-status').textContent = 'Selected. Press Ctrl+C or ⌘C to copy.'; }
  });
};

/* ---------- Extension API ---------- */
const source = () => (C.findingsMeta || {}).source || 'the earlier review';
const api = () => ({ content: C, diff: D, commits: COMMIT, coverageOf: path => coverageOf(path), md, esc, fmt, plural, figure: figureHtml, diagram: liveDiagram, drawInto, codeSlice, locBtn, whereBtn, testRef, sevChip, ctl, store: Store, kinds: KINDS, refreshMarks: (element = document) => refreshMarks(undefined, element), rerender: render, openFile, openCommit, navigator: { order: () => FileNavigator.fileOrder(navTree()), current: () => currentKey() } });
window.ExplorePR = {
  registerView(view) {
    if (!/^[A-Za-z0-9-]+$/.test(view.id || '')) throw new Error(`ExplorePR view id must be letters, digits and hyphens: ${view.id}`);
    customViews.push(view);
    if (C) { renderRail(); if (location.hash === '#' + view.id) render(); }
  },
  registerKind(name, spec) { KINDS[name] = spec; },
  routes: () => (C ? routes().map(r => r[0]) : []),
  customViews: () => customViews.map(view => view.id),
  figureViews: () => (C ? figureViews() : []),
  get api() { return api(); },
};

/* ---------- Boot ---------- */
async function boot() {
  try {
    C = window.__EXPLORE_CONTENT || await (await fetch('content.json')).json();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty">The content could not be loaded. Reload the page to try again.</div>`;
    return;
  }
  index();
  GH = C.pr.repoUrl || '';
  $('#pr-id').textContent = '#' + C.pr.number;
  $('#pr-title').textContent = C.pr.title || '';
  render(LANDING.arrive);
  Store.init();
  try {
    D = window.__EXPLORE_DIFF || await (await fetch('diff.json')).json();
    if (currentRoute === 'files') render(); else fillPendingSlices();
    onStateChange();
    if (C.commits.length) loadCommits();
  } catch (e) {
    $$('[data-pending-slice]').forEach(el => { el.innerHTML = '<div class="muted small" style="padding:12px">The code could not be loaded. Reload to try again.</div>'; });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else setTimeout(boot);
})();
</script>
