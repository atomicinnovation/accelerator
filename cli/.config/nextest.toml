# `binary(=contract)` is the exact-match form; bare `binary(contract)` is a
# substring predicate that would also capture a future `contract_helpers` or
# `contract_smoke` binary.
[profile.default]
default-filter = 'not binary(=contract)'

[profile.contract]
default-filter = 'binary(=contract)'

# Liveness assertions on real-time sends hold only while nothing else
# competes for the CPU, so each runs alone. Running alone within nextest
# does not stop the bare `mise run` scheduling other lanes beside it, so a
# send woken late by that contention gets a retry; a pacing regression
# fails every attempt, since the per-second limits are exact on the gate's
# recorded sends.
[[profile.default.overrides]]
filter = '''binary(=fetch_doi) & (
    test(public_pool_calls_start_no_more_than_five_a_second_and_all_within_two)
    | test(polite_pool_calls_all_start_within_a_second)
    | test(polite_pool_calls_start_no_more_than_ten_a_second)
    | test(an_implausible_contact_keeps_calls_to_the_public_limits)
    | test(each_pool_keeps_to_its_own_limits_when_both_are_busy)
)'''
threads-required = "num-test-threads"
retries = 2

# Real-time tests whose assertions leave wide slack may overlap the rest of
# the suite, but not each other beyond a pair.
[[profile.default.overrides]]
filter = '''binary(=fetch_doi) & (
    test(public_pool_calls_never_overlap_in_flight)
    | test(a_retry_after_holds_back_every_caller_in_the_project)
    | test(polite_pool_calls_keep_at_most_three_in_flight)
    | test(a_retry_after_holds_back_every_polite_caller)
)'''
test-group = "real-time"

[test-groups.real-time]
max-threads = 2
