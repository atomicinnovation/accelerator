[package]
name = "config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.accelerator]
role = "domain"
context = "config"
kind = "platform"

[lints]
workspace = true

[features]
# Test-only key descriptors. Only `config` and `config-adapters` may enable it,
# and only as dev-dependencies, so consumer tests exercise real keys.
test-support = []

[dependencies]
kernel = { path = "../kernel" }

[dev-dependencies]
config = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
