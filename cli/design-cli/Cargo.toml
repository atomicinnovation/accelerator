[package]
name = "accelerator-design"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Validate and process design sources"

[package.metadata.accelerator]
role = "composition-root"

[lints]
workspace = true

[[bin]]
name = "accelerator-design"
path = "src/main.rs"

# Test fixture: a black-box test entry point found through CARGO_BIN_EXE_*, not
# a shipped artifact. It is the only user of tree-lease and rustix here.
[[bin]]
name = "design-cli-fixture-warm-handover"
path = "tests/fixtures/design_cli_fixture_warm_handover.rs"

[dependencies]
design = { path = "../design" }
design-adapters = { path = "../design-adapters" }
config = { path = "../config" }
config-adapters = { path = "../config-adapters" }
vcs-adapters = { path = "../vcs-adapters" }
kernel = { path = "../kernel" }
clap = { workspace = true }
serde_json = { workspace = true }
tree-lease = { path = "../tree-lease" }
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vcs-test-support = { path = "../vcs-test-support" }
