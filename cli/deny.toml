# cargo-deny configuration for the cli/ workspace. Width kept <= 80 columns per
# the hand-duplication convention. Run via `mise run deny:check`.

[graph]
# The four shipped release triples PLUS x86_64-unknown-linux-gnu (the ubuntu CI
# dev graph), named explicitly rather than as ambiguous "dev triples", so the
# ubuntu graph a banned edge could hide in is always evaluated. The cli/
# workspace does not yet cross-compile these triples, so the ban guards a
# not-yet-built graph — necessary but not sufficient for the musl-static
# guarantee until the cli cross-compile build lands.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
# Set the policy explicitly rather than leaning on version-sensitive defaults:
# any unmaintained advisory and any yanked crate fail the check, and a
# security-vulnerability advisory fails it (deny) rather than warning.
unmaintained = "all"
yanked = "deny"
# hickory-proto 0.25 DNS-parsing DoS advisories with no upgrade path yet
# (reqwest 0.12 pins hickory-resolver 0.25). Remove when reqwest adopts 0.26.
#
# Every entry carries a `review-by: YYYY-MM-DD` in its reason, asserted by
# tests/integration/deny/test_advisory_ignores.py — cargo-deny enforces no
# expiry of its own, so an ignore added under release pressure would otherwise
# outlive its justification silently. A lapsed date is a prompt to re-check the
# upstream state and re-date or remove, not a reason to bump it blindly.
#
# The break-glass in tasks/README.md is scoped to unmaintained/yanked/notice
# advisories only. A vulnerability-class advisory takes the escalation path —
# upgrade, patch or vendor — never an ignore, because this closure reaches the
# publicly distributed signed accelerator-visualiser binary.
ignore = [
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25 DNS-parsing DoS; no upgrade path until reqwest adopts hickory-resolver 0.26. review-by: 2026-11-03" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25 DNS-parsing DoS; no upgrade path until reqwest adopts hickory-resolver 0.26. review-by: 2026-11-03" },
]

[licenses]
version = 2
# Permissive allow-list pruned to exactly the licenses the current dependency
# closure carries — cargo-deny warns on an unused allowance, so new permissive
# licenses are added here as crates that carry them enter the closure (e.g. the
# rustls/HTTP stack will re-introduce ISC/BSD/Zlib). Any copyleft / MPL / *GPL
# license must be justified per-crate via [[licenses.exceptions]], never added
# to this blanket allow.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # notify (visualiser filesystem watcher) is dual-licensed CC0-1.0 / Artistic.
    "CC0-1.0",
]
confidence-threshold = 0.8

# uluru is gix-pack's LRU pack cache, enabled by gix-odb's default features, so
# it cannot be feature-gated out. MPL-2.0 is file-level weak copyleft: we ship
# no modifications, but §3.2's notice obligation binds wherever the closure is
# actually linked — distributing such a binary requires telling recipients how
# to obtain the source. The release upload set carries
# accelerator-third-party-notices.txt, which lists each MPL-2.0 component with a
# §3.2 corresponding-source statement naming its repository and crates.io
# source; that discharges the obligation.
#
# Measured across the dispatched sub-binaries, unstripped --release,
# aarch64-apple-darwin, by counting `gix_`/`jj_lib`/`uluru` symbols:
#
#   accelerator-vcs, -work, -collaboration, -migrate  uluru linked
#   accelerator-corpus                                uluru linked
#   accelerator-visualiser                            no gix, jj-lib or uluru
#   accelerator-design, -linear, -jira                no gix, jj-lib or uluru
#
# The linear and jira sub-binaries carry the reqwest/rustls tree only, riding
# the existing permissive allow; they add no copyleft closure.
#
# The first four are a pre-existing finding, not a new one: each constructs
# InProcessProbe directly, and each already carried the closure before the
# metadata-read path moved onto it. accelerator-corpus is the one this switch
# caused — it carried none of the three before and carries all of them after.
# So the notice obligation is live today for five shipped binaries, discharged
# by accelerator-third-party-notices.txt in the release upload set. That file
# ships unsigned — it is not a trust anchor — but rides the dist/release/
# accelerator-* SLSA provenance glob like every other published asset.
#
# The visualiser alone still links none of it, so its original exception
# rationale stands unchanged. Re-check when any code under
# cli/visualiser/server calls vcs_adapters::facts or derive_at.
#
# Verify by symbol count, not by string literal: `extensions.objectFormat`
# (gix) and `There is no Jujutsu repo` (jj-lib) prove presence when found, but
# both are absent from binaries that demonstrably link the closure, so absence
# proves nothing. Plain `grep` over a Mach-O binary reports false positives
# here; use `nm -a` or `strings -a` piped to grep.
[[licenses.exceptions]]
crate = "uluru"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Exempt local path deps; registry wildcards stay denied.
allow-wildcard-paths = true
# One narrow, version-pinned skip per transitive major-version straddle that no
# first-party change can collapse — the crate has no single version its
# dependents agree on. Each masks the older side, pinned to the exact version
# rather than a bare name or skip-tree, so a genuinely new duplicate still trips
# the gate. No review-by dates: unlike the advisory ignores these have no
# upstream fix ETA; the narrow pins are what keep the carve-out set honest. The
# authoritative list is `cargo deny check bans` across deny.toml's five targets.
skip = [
    # RustCrypto 0.10 substack (sha1, sha1-checked, hmac, blake2, jj-lib); the
    # sha2 0.11 bump rides the parallel 0.11 substack alongside it.
    { crate = "digest@0.10.7", reason = "RustCrypto 0.10/0.11 straddle" },
    { crate = "crypto-common@0.1.7", reason = "RustCrypto 0.10/0.11 straddle" },
    { crate = "block-buffer@0.10.4", reason = "RustCrypto 0.10/0.11 straddle" },
    { crate = "cpufeatures@0.2.17", reason = "RustCrypto 0.10/0.11 straddle" },
    # rand 0.9/0.10 plus getrandom 0.2/0.3/0.4 spanning both and older consumers.
    { crate = "rand@0.9.5", reason = "rand 0.9/0.10 ecosystem straddle" },
    { crate = "rand_chacha@0.9.0", reason = "rand 0.9/0.10 ecosystem straddle" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9/0.10 ecosystem straddle" },
    { crate = "getrandom@0.2.17", reason = "getrandom 0.2/0.3/0.4 straddle" },
    { crate = "getrandom@0.3.4", reason = "getrandom 0.2/0.3/0.4 straddle" },
    # toml 0.8 (toml_edit 0.22) vs toml 1.0 (toml_edit 0.25); winnow 0.7/1.0.
    { crate = "toml_edit@0.22.27", reason = "toml 0.8/1.0 ecosystem straddle" },
    { crate = "toml_datetime@0.6.11", reason = "toml 0.8/1.0 ecosystem straddle" },
    { crate = "serde_spanned@0.6.9", reason = "toml 0.8/1.0 ecosystem straddle" },
    { crate = "winnow@0.7.15", reason = "toml/winnow 0.7/1.0 straddle" },
    # syn 2 vs 3 proc-macro split.
    { crate = "syn@2.0.119", reason = "syn 2/3 ecosystem straddle" },
    # cargo_metadata 0.19/0.23 build-dependency tree.
    { crate = "cargo_metadata@0.19.2", reason = "cargo_metadata 0.19/0.23 straddle" },
    { crate = "cargo-platform@0.1.9", reason = "cargo_metadata 0.19/0.23 straddle" },
    # Individually straddled transitive crates.
    { crate = "bitflags@1.3.2", reason = "bitflags 1/2 straddle (notify vs gix)" },
    { crate = "hashbrown@0.14.5", reason = "hashbrown 0.14/0.16/0.17 straddle" },
    { crate = "hashbrown@0.16.1", reason = "hashbrown 0.14/0.16/0.17 straddle" },
    { crate = "itertools@0.14.0", reason = "itertools 0.14/0.15 straddle" },
    { crate = "mio@0.8.11", reason = "mio 0.8/1.0 straddle" },
    { crate = "tower-http@0.5.2", reason = "tower-http 0.5/0.6 straddle" },
    { crate = "untrusted@0.7.1", reason = "untrusted 0.7/0.9 straddle (ring)" },
]
# rustls only — no transitive dep may re-enable default-tls and break the
# musl-static build. This covers the TLS vector only. serde-saphyr is the
# infra-out-of-domain ban: the YAML crate is reachable only through the
# document wrapper, so a direct domain import violates.
#
# gix-credentials spawns `git credential-*` helper programs and is absent only
# because the gix pin sets default-features = false, so this ban is what stops a
# later feature widening reintroducing it. curl-sys is the other transport stack
# gix can be built against. gix-transport and gix-protocol are deliberately NOT
# banned: they ARE in the graph via jj-lib's defaults, and are kept inert by
# gix's network client features being off, which the feature-graph test asserts.
deny = [
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "serde-saphyr", wrappers = ["document"] },
    { crate = "gix-credentials" },
    { crate = "curl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
