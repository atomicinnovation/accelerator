[package]
name = "work-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Gates the tests that need real VCS binaries on `PATH`:
# sync_working_copy_status.rs's real-repo `jj`/`git` tests. On, an absent
# binary hard-fails; off, those tests are skipped entirely. CI enables it
# (tasks/test/cli.py). Mirrors vcs-adapters' own bash-parity convention.
bash-parity = []

# Black-box test entry point, not a shipped artifact. Lives under
# tests/fixtures/ so it stays off the crate's normal build surface; tests
# locate it via CARGO_BIN_EXE_work-adapters-fixture and run it under a
# hermetic environment, which in-process calls cannot have.
[[bin]]
name = "work-adapters-fixture"
path = "tests/fixtures/work_adapters_fixture.rs"

[dependencies]
work = { path = "../work" }
kernel = { path = "../kernel" }
tracker = { path = "../tracker" }
corpus = { path = "../corpus" }
vcs = { path = "../vcs" }
vcs-adapters = { path = "../vcs-adapters" }
similar = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
config = { path = "../config" }
tempfile = { workspace = true }
remote-projection = { path = "../remote-projection" }
tracker-test-support = { path = "../tracker-test-support" }
vcs-test-support = { path = "../vcs-test-support" }
jira-client = { path = "../jira-client" }
linear-client = { path = "../linear-client" }
tracker-support = { path = "../tracker-support" }
http-test-support = { path = "../http-test-support" }
reqwest = { workspace = true }
hex = { workspace = true }
