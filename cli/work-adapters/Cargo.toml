[features]
# The diff_shellout golden comparison test shells the real `diff` binary. On,
# an absent binary hard-fails; off, that suite is skipped entirely. CI enables
# it (tasks/test/cli.py). Mirrors vcs-adapters' own bash-parity convention.
bash-parity = []

[dependencies]
work = { path = "../work" }
kernel = { path = "../kernel" }
tempfile = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
