[package]
name = "work-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The diff_shellout golden comparison test shells the real `diff` binary. On,
# an absent binary hard-fails; off, that suite is skipped entirely. CI enables
# it (tasks/test/cli.py). Mirrors vcs-adapters' own bash-parity convention.
bash-parity = []

[dependencies]
work = { path = "../work" }
kernel = { path = "../kernel" }
tracker = { path = "../tracker" }
corpus = { path = "../corpus" }
vcs = { path = "../vcs" }
vcs-adapters = { path = "../vcs-adapters" }
sha2 = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
remote-projection = { path = "../remote-projection" }
tracker-test-support = { path = "../tracker-test-support" }
vcs-test-support = { path = "../vcs-test-support" }
