# resolver 3 so rust-version drives MSRV-aware dependency selection.
[workspace]
resolver = "3"
members = [
    "launcher",
    "kernel",
    "verify",
    "document",
    "config",
    "config-adapters",
    "corpus",
    "corpus-adapters",
    "corpus-cli",
    "vcs",
    "vcs-adapters",
    "vcs-cli",
    "vcs-test-support",
    "store",
    "visualiser/server",
    "work",
    "work-adapters",
    "remote-projection",
    "work-cli",
    "collaboration",
    "github",
    "collaboration-cli",
    "migrate",
    "migrate-adapters",
    "migrate-cli",
    "tracker",
    "tracker-test-support",
    "http-test-support",
    "tracker-support",
    "jira-client",
    "linear-client",
    "design",
    "design-adapters",
    "design-cli",
    "process-probe"
]

[workspace.package]
version = "1.24.0-pre.48"
edition = "2021"
rust-version = "1.90.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Exact-pinned: external_subcommand capture and --help interception ordering
# are behaviour-sensitive.
clap = { version = "=4.6.1", features = ["derive"] }
# vergen and vergen-gitcl are a matched pair pinned exactly: vergen 9.1.0's
# transitive vergen-lib bump breaks the Emitter, and a vergen-gitcl minor/patch
# can float that same vergen-lib independently, so both are pinned.
vergen = { version = "=9.0.6", default-features = false }
vergen-gitcl = { version = "=1.0.8", features = ["build", "cargo"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
# default-features = false keeps native-tls/openssl out of the graph; rustls
# uses ring (not aws-lc-rs) with bundled webpki-roots (no host cert store), and
# hickory-dns bypasses getaddrinfo so DNS resolves under musl. Exact-pinned so a
# patch cannot re-scope the DNS feature back onto getaddrinfo.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots-no-provider",
    "hickory-dns",
] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring"] }
minisign-verify = "=0.2.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Caret bound: regex's 1.x line is behaviour-stable, so the exact-pin discipline
# that fences behaviour-sensitive crates is not warranted here.
regex = "1"
# Used to load hooks/test-fixtures/masks.toml, the volatile-field mask table
# shared with the Python golden-generation script (vcs-test-support::masks).
toml = "0.8"
# 0.0.x: every patch is semver-breaking, so pin exactly and review upgrades at
# the `document` boundary — the sole permitted wrapper (see deny.toml).
serde-saphyr = "=0.0.29"
# Caret bounds: temp-in-target-dir naming + RAII cleanup for atomic writes,
# a safe wrapper over the POSIX kill(pid, 0) liveness probe the mkdir-lock needs
# and the umask(2) read the config/corpus writers need (both via `process`;
# `umask` takes a `rustix::fs::Mode`, so the `fs` feature is enabled too),
# EXDEV classification, and jittered lock back-off. All 1.x/0.x behaviour-stable,
# so the exact-pin discipline is not warranted here.
tempfile = "3"
rand = "0.9"
# Two consumers: process-probe's sysconf/sysctl start-time reads, and the
# visualiser server, which delegated its own copy of that read to it.
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
# Exact-pinned: pre-1.0, and its entry classification, PAX/GNU long-name
# handling and symlink semantics are exactly what the tree extractor's
# admission rules sit on top of, so a patch bump could shift the trust boundary
# without a pin-edit review. default-features = false drops the `xattr` feature,
# whose transitive edge buys nothing once archive-supplied extended attributes
# are discarded outright.
tar = { version = "=0.4.46", default-features = false }
# The pure-Rust backend is load-bearing, not stylistic: the `zlib`, `zlib-ng`
# and `zlib-rs` backends pull `libz-sys`/`zlib-ng-sys`, which need a C toolchain
# and would break the fully-static musl cross-build. Cargo unifies features
# across the workspace, so a future crate enabling a C backend would pull it
# into the launcher silently — hence the absence guard in the launcher's
# feature-graph test.
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
# jj-lib and gix are a matched pair, pinned asymmetrically. jj-lib is EXACT
# because it declares its API unstable and a patch can shift its MSRV or its own
# gix requirement; gix is TILDE because ~0.85.0 is the range jj-lib already
# requires, so a RustSec fix is a lock update rather than a pin edit. A caret on
# a 0.x crate will not cross to the existing 0.86, which would put two gix
# graphs in the lock.
#
# gix takes default-features = false because its `default` reaches `extras` ->
# `credentials`, pulling gix-credentials — the one gix subsystem that spawns
# helper programs. jj-lib's own selection still enables everything the adapter
# calls. Widening this list is how a consumer adds a capability.
#
# A jj-lib bump moves all four of these plus the Rust toolchain and the mise jj
# CLI pin, which writes the format jj-lib reads.
jj-lib = "=0.43.0"
gix = { version = "~0.85.0", default-features = false }
# prost and pollster are jj-lib's own, adopted as direct edges: both are already
# in the lock through it, so this adds no packages. prost decodes
# jj_lib::protos::local_working_copy::Checkout (a public module, so API rather
# than a private wire format) and pollster drives the OpStore trait's async
# reads. Pinned to the majors jj-lib requires, because the decoded type comes
# from jj-lib: a major mismatch splits the graph and breaks the decode.
prost = "0.14"
pollster = "0.4"
# etcetera and dunce are jj-cli's own config-path discovery helpers, adopted
# the same way: both are already in the lock through jj-lib, so this adds no
# packages. Pinned to the exact versions jj-lib's own tree resolves, since
# replicating jj-cli's discovery logic is only faithful at the version it was
# read from.
etcetera = "0.11.0"
dunce = "1.0.5"
# Exact-pinned since octocrab is a young, actively-evolving crate whose
# builder API (base_uri, the mock-server test seam) and Error enum shape
# (the error-mapping code in the github crate depends on
# octocrab::Error::GitHub's exact fields) this workspace's own code and
# tests assume. default-features = false drops octocrab's default
# `follow-redirect` (an unexpected redirect must surface as an error, not be
# silently followed — see the github crate) and its default `retry`:
# `tower::retry`'s `Buffer` service spawns its worker task via
# `tokio::spawn` at construction time, which requires an *entered* Tokio
# runtime context, not merely a `Runtime` value to `block_on` with later —
# collaboration-cli's `BlockingGitHubClient` shim builds the `Octocrab`
# client outside any `block_on` call, so retry's spawn panics with "there
# is no reactor running"; this client has no hand-rolled retry logic to
# test either way, so dropping the feature is simpler than restructuring
# construction to happen inside a `block_on`. Also swaps the default
# `jwt-rust-crypto` for `jwt-aws-lc-rs`: octocrab hard-requires one of the
# two (a compile_error! otherwise, for its GitHub-App JWT auth path, unused
# by this workspace — only personal-access-token auth is ever performed),
# and `jwt-rust-crypto`'s `jsonwebtoken/rust_crypto` backend pulls in `rsa`,
# which `cargo deny check` flags as RUSTSEC-2023-0071; `jwt-aws-lc-rs` avoids
# it. The remaining explicit features restore the rest of the default set so
# the default build path (`Octocrab::builder()...build()`) still works:
# `rustls`+`rustls-ring` mirror this workspace's own reqwest/rustls TLS
# backend (ring, not aws-lc-rs — the JWT backend and the TLS backend are
# independent choices) and keep native-tls/openssl out of the graph per
# deny.toml; `timeout`, `tracing`, `default-client` are octocrab's own
# remaining defaults.
octocrab = { version = "=0.54.1", default-features = false, features = [
    "rustls",
    "rustls-ring",
    "timeout",
    "tracing",
    "default-client",
    "jwt-aws-lc-rs",
] }
# Minimal runtime: collaboration-cli is octocrab's only consumer of an async
# runtime in this workspace; rt for the current-thread executor, net for the
# HTTP client's sockets, time for backoff/timeouts.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "time",
] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# restriction is allow-by-default; these are the cherry-picked opt-ins.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The bootstrap hashes the whole launcher on every invocation, so binary size is
# a per-call latency term and the cold-fetch payload. `strip` trades symbol names
# for size; `lto = "thin"` trades release build time for size.
[profile.release]
strip = true
lto = "thin"
