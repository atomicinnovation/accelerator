[package]
name = "vcs-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.accelerator]
role = "test-support"

[lints]
workspace = true

# Deliberately no edge to vcs-adapters. The fixtures, the hermetic environment
# and the stubs need only tempfile and the real git/jj binaries, and taking that
# edge would create a dev-dependency cycle (vcs-adapters tests ->
# vcs-test-support -> vcs-adapters).
[dependencies]
tempfile = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }

# The build step's builder, run once per `test:unit:cli` run before any test.
# Lives under tests/fixtures/ for the same reason as vcs-adapters' fixture
# binaries: it stays off the crate's normal build surface. `test = false`
# spares it a libtest harness, so the unit listing names one executable.
[[bin]]
name = "shared-fixtures"
path = "tests/fixtures/shared_fixtures.rs"
test = false
