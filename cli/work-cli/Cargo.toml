[package]
name = "accelerator-work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Manage work items"

[package.metadata.accelerator]
role = "composition-root"

[lints]
workspace = true

[[bin]]
name = "accelerator-work"
path = "src/main.rs"

[features]
# Gates sync_working_copy_status.rs's real-repo `jj`/`git` tests. On, an absent
# binary hard-fails; off, those tests are skipped entirely. CI enables it
# (tasks/test/cli.py).
bash-parity = []

# Black-box test entry point, not a shipped artifact. Lives under
# tests/fixtures/ so it stays off the crate's normal build surface; tests
# locate it via CARGO_BIN_EXE_work-cli-fixture and run it under a hermetic
# environment, which in-process calls cannot have.
[[bin]]
name = "work-cli-fixture"
path = "tests/fixtures/work_cli_fixture.rs"

[dependencies]
work = { path = "../work" }
work-adapters = { path = "../work-adapters" }
tracker = { path = "../tracker" }
tracker-support = { path = "../tracker-support" }
jira-client = { path = "../jira-client" }
linear-client = { path = "../linear-client" }
corpus = { path = "../corpus" }
corpus-adapters = { path = "../corpus-adapters" }
store = { path = "../store" }
document = { path = "../document" }
config = { path = "../config" }
config-adapters = { path = "../config-adapters" }
vcs = { path = "../vcs" }
vcs-adapters = { path = "../vcs-adapters" }
kernel = { path = "../kernel" }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
graphql-test-support = { path = "../graphql-test-support" }
http-test-support = { path = "../http-test-support" }
tracker-test-support = { path = "../tracker-test-support" }
vcs-test-support = { path = "../vcs-test-support" }
