[package]
name = "accelerator-work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The work create|show|resolve|diff|update sub-binary."

[lints]
workspace = true

[features]
# Independent of work-adapters' own bash-parity flag of the same name —
# vcs-cli/vcs-adapters follow the identical two-independent-features shape,
# coordinated only by CI's --all-features run.
bash-parity = []

[[bin]]
name = "accelerator-work"
path = "src/main.rs"

[dependencies]
work = { path = "../work" }
work-adapters = { path = "../work-adapters" }
tracker = { path = "../tracker" }
tracker-support = { path = "../tracker-support" }
jira-client = { path = "../jira-client" }
linear-client = { path = "../linear-client" }
corpus = { path = "../corpus" }
corpus-adapters = { path = "../corpus-adapters" }
store = { path = "../store" }
document = { path = "../document" }
config = { path = "../config" }
config-adapters = { path = "../config-adapters" }
vcs = { path = "../vcs" }
vcs-adapters = { path = "../vcs-adapters" }
kernel = { path = "../kernel" }
clap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
http-test-support = { path = "../http-test-support" }
