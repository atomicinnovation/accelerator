[package]
name = "migrate-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The dirty-path scanner suite builds real git repositories. On, an absent
# binary hard-fails; off, that suite is skipped. Mirrors vcs-adapters' own
# bash-parity convention.
bash-parity = []

[dependencies]
migrate = { path = "../migrate" }
kernel = { path = "../kernel" }
config = { path = "../config" }
config-adapters = { path = "../config-adapters" }
vcs = { path = "../vcs" }
vcs-adapters = { path = "../vcs-adapters" }
store = { path = "../store" }
corpus = { path = "../corpus" }
corpus-adapters = { path = "../corpus-adapters" }
tracing = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vcs-test-support = { path = "../vcs-test-support" }
