[package]
name = "vcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The repo facts are plain values and the probe arrives by injection. As in
# `corpus`, the pup rule permits `kernel::Error` for when a fallible port needs
# the shared diagnostic: `DualRoots`' two sides are the first use, since the
# domain crate cannot import `vcs-adapters`'s adapter-specific `Error` type.
[dependencies]
kernel = { path = "../kernel" }
