[package]
name = "accelerator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[package.metadata.accelerator]
role = "launcher"

[lints]
workspace = true

[features]
# The session-start tracking tests build real jj repositories. Same contract as
# vcs-adapters: on, an absent jj hard-fails; off, only the git cases run. CI
# enables it (tasks/test/cli.py).
bash-parity = []

[[bin]]
name = "accelerator"
path = "src/main.rs"

# Test fixture: must live in this package so black-box tests can locate it via
# CARGO_BIN_EXE_accelerator-fixture (cargo sets that only for the package's bins).
[[bin]]
name = "accelerator-fixture"
path = "tests/fixtures/accelerator_fixture.rs"

# Test fixture: a stand-in daemon holding tree leases, found through
# CARGO_BIN_EXE_launcher-fixture-lease-holder; not a shipped artifact.
[[bin]]
name = "launcher-fixture-lease-holder"
path = "tests/fixtures/launcher_fixture_lease_holder.rs"

[dependencies]
kernel = { path = "../kernel" }
config = { path = "../config" }
config-adapters = { path = "../config-adapters" }
vcs-adapters = { path = "../vcs-adapters" }
lease = { path = "../lease" }
process = { path = "../process" }
clap = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
minisign-verify = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# Declared directly rather than reached transitively through `store`: the tree
# resolver needs flock, openat with O_NOFOLLOW, fstatat and utimensat, and
# depending on a transitive edge is the coupling the workspace's pin discipline
# exists to prevent.
rustix = { workspace = true }
# The generation suffix is drawn from the platform CSPRNG. "Fresh by
# construction" is what removes the rename-collision branch when a materialised
# tree is published, and this repository has already been bitten by pid reuse in
# cache paths.
rand = { workspace = true }

[build-dependencies]
vergen = { workspace = true }
vergen-gitcl = { workspace = true }
# Reads the committed pins.toml to embed the expected tree-digest map.
toml = { workspace = true }

[dev-dependencies]
time = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
http-test-support = { path = "../http-test-support" }
vcs-test-support = { path = "../vcs-test-support" }
