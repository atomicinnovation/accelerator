[package]
name = "corpus-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The differential suites shell out to bash, awk, and the repo's own scripts.
# Under the feature an absent tool hard-fails rather than skipping — Rust's
# harness has no skip primitive, so a silent early return would register as a
# green PASS. Off, only the pure-Rust tables run, so `cargo test` stays usable
# on a machine without the toolchain. CI enables it (tasks/test/cli.py).
bash-parity = []

[dependencies]
corpus = { path = "../corpus" }
document = { path = "../document" }
store = { path = "../store" }
vcs-adapters = { path = "../vcs-adapters" }
regex = { workspace = true }
time = { workspace = true }
tempfile = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }

# Test-only edge to the shared VCS harness. Under resolver 3 a dev-dependency's
# features stay out of the normal build, which matters because the visualiser
# server depends on this crate. The normal vcs-adapters edge above is untouched.
[dev-dependencies]
vcs-test-support = { path = "../vcs-test-support" }
