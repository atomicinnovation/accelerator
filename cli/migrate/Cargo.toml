[package]
name = "migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.accelerator]
role = "domain"
context = "migrate"
kind = "product"

[lints]
workspace = true

# `corpus` because `migrate` reuses `corpus::Record`/`RecordStore`/`linkage`
# directly throughout — its own session log is a `corpus`-typed record, not a
# new record type. The widening is mirrored in `cli/pup.ron`'s
# `migrate_domain_imports_only_permitted` rule.
[dependencies]
corpus = { path = "../corpus" }
kernel = { path = "../kernel" }
