[package]
name = "config-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.accelerator]
role = "adapter"
context = "config"

[lints]
workspace = true

# Composition-root demonstration and black-box test entry point — not a shipped
# artifact. Lives under tests/fixtures/ so it stays off the crate's normal build
# surface; black-box tests locate it via CARGO_BIN_EXE_config-adapters-fixture.
[[bin]]
name = "config-adapters-fixture"
path = "tests/fixtures/config_adapters_fixture.rs"

[dependencies]
config = { path = "../config" }
kernel = { path = "../kernel" }
document = { path = "../document" }
store = { path = "../store" }
vcs = { path = "../vcs" }
dunce = { workspace = true }
tempfile = { workspace = true }
rustix = { workspace = true, features = ["event"] }
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
config = { path = "../config", features = ["test-support"] }
